components:

  securitySchemes:
    credencial:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <credencial>`, la que devuelven `POST /sesion` y `POST /registro`. Es una
        cadena opaca. Vigencia según el ámbito de la cuenta (D-31): **tienda 7 días**, **gestión 8 horas**.
        Vencida, 401 `sesion_expirada`; revocada o inventada, 401 `sesion_invalida`. Desactivar la cuenta
        o cambiar su contraseña revoca todas sus credenciales. La cookie de la administración **no**
        autentica contra la API: sólo este encabezado. Ni la credencial ni la contraseña se escriben en
        el log.

        Las operaciones con `security: [{}, {credencial: []}]` son de **sesión opcional**: sin
        credencial responden al visitante; con una que no sirve, 401 (salvo `GET /categorias`, que la
        ignora).

  parameters:
    Pagina:
      name: pagina
      in: query
      description: Una página después de la última devuelve `datos` vacío, no 404.
      schema: { type: integer, minimum: 1, default: 1 }
    PorPagina:
      name: por_pagina
      in: query
      description: Más que el tope es 422.
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

    Producto:
      name: producto
      in: path
      required: true
      description: El id del producto. Un valor que no es número es 404.
      schema: { type: integer }
    Linea:
      name: linea
      in: path
      required: true
      description: Un renglón del carrito propio. De otra cuenta, 404.
      schema: { type: integer }
    Pedido:
      name: pedido
      in: path
      required: true
      description: Un pedido de la cuenta. Ajeno o inexistente, el mismo 404.
      schema: { type: integer }
    Intento:
      name: intento
      in: path
      required: true
      description: Un intento de pago del pedido.
      schema: { type: integer }
    Expires:
      name: expires
      in: query
      required: true
      description: Parte de la firma (D-22). La pone el servidor.
      schema: { type: integer }
    Signature:
      name: signature
      in: query
      required: true
      description: La firma. Tocada o vencida, 403.
      schema: { type: string }

    Q:
      name: q
      in: query
      description: Texto contiene, hasta 100. Los comodines de SQL se buscan como texto.
      schema: { type: string, maxLength: 100 }
    Proveedor:
      name: proveedor
      in: path
      required: true
      schema: { type: integer }
    Cliente:
      name: cliente
      in: path
      required: true
      schema: { type: integer }
    FiltroProducto:
      name: producto_id
      in: query
      schema: { type: integer }
    Desde:
      name: desde
      in: query
      description: Día completo, `AAAA-MM-DD`.
      schema: { type: string, format: date }
    Hasta:
      name: hasta
      in: query
      description: Día completo. Anterior a `desde` es 422 (no devolvería nada).
      schema: { type: string, format: date }
    ImpresionFormato:
      name: formato
      in: query
      schema: { type: string, enum: [pdf, csv], default: pdf }
    ImpresionColumnas:
      name: columnas[]
      in: query
      description: Una columna que pide un permiso que no se tiene es 422 en `columnas.N`.
      schema: { type: array, items: { type: string } }
    ImpresionOrientacion:
      name: orientacion
      in: query
      schema: { type: string, enum: [vertical, horizontal] }
    ImpresionHoja:
      name: hoja
      in: query
      schema: { type: string, enum: [a4, oficio] }
    ImpresionDensidad:
      name: densidad
      in: query
      schema: { type: string, enum: [normal, compacta] }
    AjusteOperacion:
      name: operacion
      in: query
      required: true
      schema: { type: string, enum: [precio, costo, ganancia, redondeo, recalculo] }

    Orden:
      name: orden
      in: path
      required: true
      description: La orden de compra.
      schema: { type: integer }
    Venta:
      name: venta
      in: path
      required: true
      schema: { type: integer }
    Entrega:
      name: entrega
      in: path
      required: true
      description: Una entrega de esa venta; de otra venta, 404.
      schema: { type: integer }
    Comprobante:
      name: comprobante
      in: path
      required: true
      description: Un comprobante de transferencia de esa venta; de otra venta, 404.
      schema: { type: integer }
    Usuario:
      name: usuario
      in: path
      required: true
      description: Una cuenta del personal; una de la tienda es 404.
      schema: { type: integer }
    Rol:
      name: rol
      in: path
      required: true
      schema: { type: integer }
    PeriodoDesde:
      name: desde
      in: query
      description: Por omisión, el primero del mes en curso.
      schema: { type: string, format: date }
    PeriodoHasta:
      name: hasta
      in: query
      description: Por omisión, hoy. Anterior a `desde` es 422 en `hasta`.
      schema: { type: string, format: date }

  schemas:
    Importe:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Dinero como cadena, dos decimales, punto, sin separador de miles (A-17).
      examples: ['60500.00']
    Fecha:
      type: string
      format: date-time
      description: ISO 8601 en UTC, con `Z`.
      examples: ['2026-11-08T07:00:00Z']
    Ambito:
      type: string
      enum: [gestion, tienda]
    Paginado:
      type: object
      description: |
        El sobre de todo listado (api.md §2). El orden desempata siempre por `id`. Un listado sin
        resultados tiene `ultima_pagina: 1` y `total: 0`. Cada listado agrega a `datos` sus filas y,
        si las tiene, claves propias del sobre (`totales`, `conteos`…).
      required: [datos, pagina, por_pagina, ultima_pagina, total, criterios]
      properties:
        datos: { type: array, items: {} }
        pagina: { type: integer, minimum: 1 }
        por_pagina: { type: integer, minimum: 1 }
        ultima_pagina: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        criterios:
          type: object
          description: Lo que el servidor aplicó, normalizado. Siempre un objeto, `{}` si no hay (HL-137).
    Error:
      type: object
      description: |
        `mensaje` se muestra tal cual y nunca lleva clases, rutas ni SQL. `codigo` le dice al cliente qué
        hacer sin leer el texto. `errores` trae los campos del 422; en los demás, objeto vacío.
      required: [mensaje, codigo, errores]
      properties:
        mensaje: { type: string }
        codigo:
          type: string
          enum:
            - sin_sesion
            - sesion_invalida
            - sesion_expirada
            - sin_permiso
            - no_encontrado
            - metodo_no_permitido
            - stock_insuficiente
            - carrito_cambio
            - checkout_vencido
            - transicion_invalida
            - regla_de_negocio
            - validacion
            - demasiados_intentos
            - error_interno
        errores:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    UsuarioDeLaCredencial:
      type: object
      required: [nombre, apellido, email]
      properties:
        nombre: { type: string }
        apellido: { type: string }
        email: { type: string, format: email }
    Credencial:
      type: object
      required: [credencial, tipo, vence, usuario]
      properties:
        credencial: { type: string, description: Opaca. }
        tipo: { type: string, const: Bearer }
        vence: { $ref: '#/components/schemas/Fecha' }
        usuario: { $ref: '#/components/schemas/UsuarioDeLaCredencial' }
    Yo:
      type: object
      required: [nombre, apellido, email, rol, permisos]
      properties:
        nombre: { type: string }
        apellido: { type: string }
        email: { type: string, format: email }
        rol:
          type: object
          required: [nombre, ambito]
          properties:
            nombre: { type: string }
            ambito: { $ref: '#/components/schemas/Ambito' }
        permisos:
          type: array
          items: { type: string }
          description: Ordenados. Ayuda de interfaz, nunca autoridad.
    UrlFirmada:
      type: object
      required: [url, vence]
      properties:
        url: { type: string, format: uri, description: Se abre sin credencial; la firma es la autorización (D-22). }
        vence: { $ref: '#/components/schemas/Fecha' }

    # ── Tienda ──
    Disponibilidad:
      type: string
      enum: [disponible, ultimas_unidades, sin_stock]
      description: Por niveles, también para el visitante. Nunca el número de unidades.
    PrecioConTexto:
      type: object
      required: [importe, texto]
      properties:
        importe: { $ref: '#/components/schemas/Importe' }
        texto: { type: string }
    PreciosTienda:
      type: object
      description: Sólo con `tienda.ver_precios`. Sin el permiso la clave **no está**, ni en `null` (regla 21).
      required: [contado, lista]
      properties:
        contado: { $ref: '#/components/schemas/PrecioConTexto' }
        lista: { $ref: '#/components/schemas/PrecioConTexto' }
    Referencia:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer }
        nombre: { type: string }
    CategoriaArbol:
      type: object
      required: [id, nombre, hijas]
      properties:
        id: { type: integer }
        nombre: { type: string }
        hijas: { type: array, items: { $ref: '#/components/schemas/CategoriaArbol' } }
    ProductoTienda:
      type: object
      required: [id, codigo, nombre, descripcion_breve, imagen, categoria, es_novedad, es_destacado, disponibilidad, disponibilidad_texto]
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        descripcion_breve: { type: string, maxLength: 250, description: 'Las primeras 25 palabras, con «…» si se cortó (D-12).' }
        imagen: { type: string, format: uri, description: 'Absoluta, con el host del pedido. Sin foto, la imagen por omisión: nunca `null`.' }
        categoria: { $ref: '#/components/schemas/Referencia' }
        es_novedad: { type: boolean }
        es_destacado: { type: boolean }
        disponibilidad: { $ref: '#/components/schemas/Disponibilidad' }
        disponibilidad_texto: { type: string }
        precios: { $ref: '#/components/schemas/PreciosTienda' }
    ProductoFicha:
      allOf:
        - $ref: '#/components/schemas/ProductoTienda'
        - type: object
          required: [descripcion, galeria, marca]
          properties:
            descripcion: { type: string, description: Vacía si no hay; nunca `null`. }
            galeria: { type: array, minItems: 1, items: { type: string, format: uri } }
            marca:
              oneOf:
                - $ref: '#/components/schemas/Referencia'
                - type: 'null'
    ModoEntrega:
      type: string
      enum: [retiro, envio]
    MedioPago:
      type: string
      enum: [contado, transferencia, pasarela]
      description: 'Contado y transferencia cobran el precio de contado; la pasarela, el de lista. Contado vale sólo con retiro (D-28).'
    Direccion:
      type: object
      required: [calle, numero, codigo_postal, localidad, provincia]
      properties:
        calle: { type: string, maxLength: 150 }
        numero: { type: string, maxLength: 10 }
        piso_depto: { type: [string, 'null'], maxLength: 20 }
        codigo_postal: { type: string, maxLength: 10 }
        localidad: { type: string, maxLength: 100 }
        provincia:
          type: string
          description: Una de la lista cerrada, escrita igual (api.md §5).
          enum: [Buenos Aires, Ciudad Autónoma de Buenos Aires, Catamarca, Chaco, Chubut, Córdoba, Corrientes, Entre Ríos, Formosa, Jujuy, La Pampa, La Rioja, Mendoza, Misiones, Neuquén, Río Negro, Salta, San Juan, San Luis, Santa Cruz, Santa Fe, Santiago del Estero, Tierra del Fuego, Tucumán]
    Perfil:
      type: object
      required: [nombre, apellido, email, telefono, razon_social, tipo_doc, tipo_doc_texto, nro_doc, condicion_iva, condicion_iva_texto, direccion]
      properties:
        nombre: { type: string }
        apellido: { type: string }
        email: { type: string, format: email }
        telefono: { type: [string, 'null'] }
        razon_social: { type: string }
        tipo_doc: { type: [string, 'null'], enum: [dni, cuit, cuil, null] }
        tipo_doc_texto: { type: [string, 'null'] }
        nro_doc: { type: [string, 'null'] }
        condicion_iva: { type: string, description: 'Sólo para verse: la carga el local.' }
        condicion_iva_texto: { type: string }
        direccion:
          oneOf:
            - $ref: '#/components/schemas/Direccion'
            - type: 'null'
    AvisoDeCarrito:
      type: object
      description: 'La misma forma que `cambios` del 409 `carrito_cambio`.'
      required: [producto_id, descripcion, tipo]
      properties:
        producto_id: { type: integer }
        descripcion: { type: string }
        tipo: { type: string, enum: [precio, inactivo, disponibilidad] }
        lista: { type: string, enum: [contado, lista] }
        anterior: { $ref: '#/components/schemas/Importe' }
        actual: { $ref: '#/components/schemas/Importe' }
        pedida: { type: integer }
        disponibilidad: { $ref: '#/components/schemas/Disponibilidad' }
    RenglonDeCarrito:
      type: object
      required: [id, cantidad, producto]
      properties:
        id: { type: integer }
        cantidad: { type: integer }
        producto:
          type: object
          required: [id, codigo, nombre, imagen, en_tienda, disponibilidad, disponibilidad_texto]
          properties:
            id: { type: integer }
            codigo: { type: string }
            nombre: { type: string }
            imagen: { type: string, format: uri }
            en_tienda: { type: boolean, description: 'En `false` el renglón no suma a los totales y frena el checkout.' }
            disponibilidad: { $ref: '#/components/schemas/Disponibilidad' }
            disponibilidad_texto: { type: string }
        precios:
          type: object
          description: Sólo con `tienda.ver_precios`.
          properties:
            contado: { type: object, properties: { unitario: { $ref: '#/components/schemas/Importe' }, subtotal: { $ref: '#/components/schemas/Importe' }, texto: { type: string } } }
            lista: { type: object, properties: { unitario: { $ref: '#/components/schemas/Importe' }, subtotal: { $ref: '#/components/schemas/Importe' }, texto: { type: string } } }
    Carrito:
      type: object
      required: [id, estado, estado_texto, reservado_hasta, unidades, renglones, avisos]
      properties:
        id: { type: [integer, 'null'], description: '`null` si todavía no hay carrito (el `GET` no lo crea).' }
        estado: { type: string, enum: [activo, en_checkout] }
        estado_texto: { type: string }
        reservado_hasta:
          oneOf:
            - $ref: '#/components/schemas/Fecha'
            - type: 'null'
        unidades: { type: integer, description: La suma de las cantidades. }
        renglones: { type: array, items: { $ref: '#/components/schemas/RenglonDeCarrito' } }
        totales: { $ref: '#/components/schemas/PreciosTienda' }
        avisos: { type: array, items: { $ref: '#/components/schemas/AvisoDeCarrito' } }
    Checkout:
      allOf:
        - $ref: '#/components/schemas/Carrito'
        - type: object
          required: [medios, entrega]
          properties:
            medios:
              type: array
              items:
                type: object
                required: [medio, texto, modos_entrega]
                properties:
                  medio: { $ref: '#/components/schemas/MedioPago' }
                  texto: { type: string, description: Cómo se paga. }
                  modos_entrega: { type: array, items: { $ref: '#/components/schemas/ModoEntrega' } }
                  total: { $ref: '#/components/schemas/Importe' }
            entrega:
              type: array
              items:
                type: object
                required: [modo, texto]
                properties:
                  modo: { $ref: '#/components/schemas/ModoEntrega' }
                  texto: { type: string }
                  costo: { $ref: '#/components/schemas/Importe' }
    EstadoPago:
      type: string
      enum: [aprobado, pendiente, en_revision, rechazado, sin_cobrar]
      description: Derivado de los datos, no lo elige nadie (regla 9). Tabla en api.md §7.5 y §7.7.
    Pedido:
      type: object
      required: [id, numero, estado, estado_texto, medio_pago, medio_pago_texto, modo_entrega, modo_entrega_texto, direccion, reserva_vence, creado, lineas]
      properties:
        id: { type: integer }
        numero: { type: string, examples: [V-00042] }
        estado: { type: string }
        estado_texto: { type: string }
        medio_pago: { $ref: '#/components/schemas/MedioPago' }
        medio_pago_texto: { type: string }
        modo_entrega: { $ref: '#/components/schemas/ModoEntrega' }
        modo_entrega_texto: { type: string }
        direccion:
          description: Copiada al pedido; `null` con retiro.
          oneOf:
            - $ref: '#/components/schemas/Direccion'
            - type: 'null'
        reserva_vence:
          description: 'Hasta cuándo se guarda la mercadería; `null` cobrado o cancelado.'
          oneOf:
            - $ref: '#/components/schemas/Fecha'
            - type: 'null'
        creado: { $ref: '#/components/schemas/Fecha' }
        lineas:
          type: array
          items:
            type: object
            required: [producto_id, descripcion, cantidad]
            properties:
              producto_id: { type: integer }
              descripcion: { type: string }
              cantidad: { type: integer }
              precio_unitario: { $ref: '#/components/schemas/Importe' }
              total: { $ref: '#/components/schemas/Importe' }
        importes:
          type: object
          description: Sólo con `tienda.ver_precios`.
          properties:
            subtotal: { $ref: '#/components/schemas/Importe' }
            costo_envio: { $ref: '#/components/schemas/Importe' }
            total: { $ref: '#/components/schemas/Importe' }
    Transferencia:
      type: object
      required: [alias, titular, comprobante_cargado, aviso]
      properties:
        alias: { type: string }
        titular: { type: string }
        comprobante_cargado: { type: boolean }
        aviso: { type: [string, 'null'] }
    PedidoDetalle:
      allOf:
        - $ref: '#/components/schemas/Pedido'
        - type: object
          required: [estado_pago, estado_pago_texto, ultimo_pago, comprobante_disponible, transferencia]
          properties:
            estado_pago: { $ref: '#/components/schemas/EstadoPago' }
            estado_pago_texto: { type: string }
            ultimo_pago:
              oneOf:
                - type: object
                  required: [id, pasarela, pasarela_texto, estado, estado_texto, creado]
                  properties:
                    id: { type: integer }
                    pasarela: { type: string }
                    pasarela_texto: { type: string }
                    estado: { type: string }
                    estado_texto: { type: string }
                    creado: { $ref: '#/components/schemas/Fecha' }
                - type: 'null'
            comprobante_disponible: { type: boolean }
            transferencia:
              oneOf:
                - $ref: '#/components/schemas/Transferencia'
                - type: 'null'
    PedidoResumen:
      type: object
      required: [id, numero, creado, estado, estado_texto, estado_pago, estado_pago_texto, unidades]
      properties:
        id: { type: integer }
        numero: { type: string }
        creado: { $ref: '#/components/schemas/Fecha' }
        estado: { type: string }
        estado_texto: { type: string }
        estado_pago: { $ref: '#/components/schemas/EstadoPago' }
        estado_pago_texto: { type: string }
        unidades: { type: integer }
        importes:
          type: object
          description: Sólo con `tienda.ver_precios`.
          properties:
            total: { $ref: '#/components/schemas/Importe' }
    Intento:
      type: object
      description: Un pedido de cobro a una pasarela. **No es un pago**.
      required: [id, pasarela, pasarela_texto, estado, estado_texto, url_pago, vence, resuelto, creado, pedido]
      properties:
        id: { type: integer }
        pasarela: { type: string, enum: [mercadopago, simulador] }
        pasarela_texto: { type: string }
        estado:
          type: string
          enum: [pendiente, aprobado, rechazado, vencido, error]
          description: Ni `vencido` ni `error` afirman un rechazo.
        estado_texto: { type: string }
        importe: { $ref: '#/components/schemas/Importe' }
        url_pago: { type: [string, 'null'], format: uri, description: 'Sólo Mercado Pago, mientras está pendiente.' }
        vence: { $ref: '#/components/schemas/Fecha' }
        resuelto:
          oneOf:
            - $ref: '#/components/schemas/Fecha'
            - type: 'null'
        creado: { $ref: '#/components/schemas/Fecha' }
        pedido:
          type: object
          required: [id, numero, estado, estado_texto, estado_pago, estado_pago_texto]
          properties:
            id: { type: integer }
            numero: { type: string }
            estado: { type: string }
            estado_texto: { type: string }
            estado_pago: { $ref: '#/components/schemas/EstadoPago' }
            estado_pago_texto: { type: string }

    # ── Gestión ──
    Hecho:
      type: object
      description: Lo que pasó, con un `mensaje` que dice lo que pasó de verdad. La forma de `datos` la da cada operación.
      required: [datos]
      properties:
        datos: { type: object }
        mensaje: { type: string }
    Marca:
      type: object
      required: [id, nombre, slug, logo, activo]
      properties:
        id: { type: integer }
        nombre: { type: string }
        slug: { type: string }
        logo: { type: [string, 'null'], format: uri }
        activo: { type: boolean }
        productos: { type: integer, description: 'Cuántos la usan (lo cuenta la base).' }
    MarcaEntrada:
      type: object
      required: [nombre, activo]
      properties:
        nombre: { type: string, minLength: 2, maxLength: 100 }
        activo: { type: boolean, description: Viaja siempre (M-31). }
        logo: { type: string, format: binary, description: 'jpg, png o webp, hasta 512 KB; sin SVG.' }
    CategoriaFila:
      type: object
      required: [id, nombre, slug, parent_id, ruta, dentro_de, nivel, orden, activo]
      properties:
        id: { type: integer }
        nombre: { type: string }
        slug: { type: string }
        parent_id: { type: [integer, 'null'] }
        ruta: { type: string, examples: ['Periféricos › Teclados'] }
        dentro_de: { type: [string, 'null'] }
        nivel: { type: integer, minimum: 1, maximum: 3 }
        orden: { type: integer }
        activo: { type: boolean }
        subcategorias: { type: integer }
        productos: { type: integer }
        ancestros: { type: array, items: { $ref: '#/components/schemas/Referencia' }, description: Sólo en la ficha. }
        contenido_activo:
          type: object
          description: Sólo en la ficha, para avisar antes de desactivar.
          properties:
            subcategorias: { type: integer }
            productos: { type: integer }
    CategoriaEntrada:
      type: object
      required: [nombre, parent_id, orden, activo]
      properties:
        nombre: { type: string, description: Único entre hermanas. }
        parent_id: { type: [integer, 'null'], description: '`null` es raíz. Un ciclo o un cuarto nivel es 422.' }
        orden: { type: integer }
        activo: { type: boolean }
    ProductoGestion:
      type: object
      description: |
        La representación de gestión (`forma=gestion`), por permiso (regla 36): con `producto.ver`, lo de
        abajo salvo lo que sigue; `costo_promedio` y `margen` con `precio.ver_costo`; `stock` y
        `stock_reservado` con `stock.ver`. Sin el permiso, **la clave no está**.
      required: [id, codigo, nombre, texto, imagen, categoria, marca, activo, destacado, precio_manual, disponible, stock_minimo, cantidad_reposicion, sin_proveedor]
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        texto: { type: string, description: 'Cómo se nombra al elegirlo: el mismo rótulo de todo el sistema.' }
        imagen: { type: [string, 'null'], format: uri }
        categoria: { type: object, properties: { id: { type: integer }, nombre: { type: string }, ruta: { type: string }, activo: { type: boolean } } }
        marca:
          oneOf:
            - { type: object, properties: { id: { type: integer }, nombre: { type: string }, activo: { type: boolean } } }
            - type: 'null'
        activo: { type: boolean }
        destacado: { type: boolean }
        precio_manual: { type: boolean }
        precios: { $ref: '#/components/schemas/PreciosTienda' }
        disponible: { type: integer, description: 'Lo dice `Producto::stock_disponible` (regla 6).' }
        stock_minimo: { type: integer }
        cantidad_reposicion: { type: integer }
        sin_proveedor: { type: boolean, description: 'Se repone, pero no se le puede comprar a nadie activo.' }
        costo_promedio: { $ref: '#/components/schemas/Importe' }
        margen: { type: string }
        stock: { type: integer }
        stock_reservado: { type: integer }
    ProductoGestionFicha:
      allOf:
        - $ref: '#/components/schemas/ProductoGestion'
        - type: object
          description: '`ganancia`, `ganancia_aplicada` e `historial` con `producto.editar`; `calculo` con `precio.ver_costo`.'
          properties:
            descripcion: { type: string }
            alicuota_iva: { type: string }
            imagenes:
              type: array
              items: { type: object, properties: { ruta: { type: string }, url: { type: string, format: uri } } }
            ganancia: { type: [string, 'null'], description: '`null`: hereda la de su categoría.' }
            ganancia_aplicada: { type: string }
            calculo: { $ref: '#/components/schemas/Calculo' }
            historial:
              type: array
              description: Los últimos cinco cambios de precio.
              items:
                type: object
                properties:
                  fecha: { $ref: '#/components/schemas/Fecha' }
                  contado_anterior: { $ref: '#/components/schemas/Importe' }
                  contado_nuevo: { $ref: '#/components/schemas/Importe' }
                  motivo: { type: string }
                  motivo_texto: { type: string }
                  usuario: { type: string }
    ProductoEntrada:
      type: object
      description: |
        `multipart/form-data` si lleva `imagenes[]`; para editar con archivos, `POST` con `_method=PATCH`
        (HL-110). `imagenes_orden` es la lista final, en JSON: `"actual:<ruta>"` para cada imagen que se
        queda y `"nueva:<n>"` para el archivo n. `destacado` sólo con `producto.editar`; ausente, sin cambio.
      required: [codigo, nombre, categoria_id, alicuota_iva, activo, precio_manual]
      properties:
        codigo: { type: string, description: Se pasa a mayúsculas. Único. }
        nombre: { type: string }
        descripcion: { type: string }
        categoria_id: { type: integer }
        marca_id: { type: [integer, 'null'] }
        alicuota_iva: { type: string, description: Una de `GET /productos/opciones`. }
        activo: { type: boolean }
        precio_manual: { type: boolean }
        precio_contado: { type: string, description: 'Con `precio_manual`. Acepta «25.000,50».' }
        precio_lista: { type: string }
        ganancia: { type: [string, 'null'] }
        stock_minimo: { type: integer }
        cantidad_reposicion: { type: integer }
        destacado: { type: boolean }
        imagenes[]: { type: array, maxItems: 5, items: { type: string, format: binary } }
        imagenes_orden: { type: string, examples: ['["nueva:0","actual:productos/a.webp"]'] }
    Calculo:
      type: object
      description: 'El desglose del precio (`App\Support\Api\Desglose`): el mismo en la ficha y en la simulación.'
      properties:
        costo_neto: { $ref: '#/components/schemas/Importe' }
        ganancia: { type: string }
        margen: { type: string }
        factores: { type: array, items: { type: object } }
        contado: { $ref: '#/components/schemas/CalculoLista' }
        lista: { $ref: '#/components/schemas/CalculoLista' }
    CalculoLista:
      type: object
      properties:
        neto: { $ref: '#/components/schemas/Importe' }
        final: { $ref: '#/components/schemas/Importe' }
        impuestos:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              alicuota: { type: string }
              comprobante: { type: string }
              importe: { $ref: '#/components/schemas/Importe' }
    VinculoEntrada:
      type: object
      description: '`costo_ultimo` y `codigo_proveedor` **tienen que venir**: vacío es «no lo sé», ausente es 422.'
      required: [costo_ultimo, codigo_proveedor, es_preferido]
      properties:
        costo_ultimo: { type: [string, 'null'] }
        codigo_proveedor: { type: [string, 'null'] }
        es_preferido: { type: boolean }
    Vinculo:
      type: object
      properties:
        proveedor: { type: object, properties: { id: { type: integer }, razon_social: { type: string }, activo: { type: boolean }, plazo_entrega_dias: { type: [integer, 'null'] } } }
        costo_ultimo: { type: [string, 'null'], description: Sólo con `precio.ver_costo`. }
        codigo_proveedor: { type: [string, 'null'] }
        es_preferido: { type: boolean }
        mas_barato: { type: boolean }
        diferencia: { type: [number, 'null'], description: 'Cuánto más caro que el más barato, en %.' }
        pedido_en_curso:
          oneOf:
            - { type: object, properties: { id: { type: integer }, numero: { type: string }, estado_texto: { type: string } } }
            - type: 'null'
        producto: { type: object, properties: { id: { type: integer }, nombre: { type: string }, codigo: { type: string } } }
    Cliente:
      type: object
      required: [id, texto, razon_social, documento]
      properties:
        id: { type: integer }
        texto: { type: string }
        razon_social: { type: string }
        documento: { type: [string, 'null'] }
        tipo_doc: { type: [string, 'null'] }
        nro_doc: { type: [string, 'null'] }
        condicion_iva: { type: string }
        condicion_iva_texto: { type: string }
        tipo_comprobante: { type: string }
        tipo_comprobante_texto: { type: string }
        email: { type: [string, 'null'] }
        telefono: { type: [string, 'null'] }
        con_cuenta: { type: boolean }
        cantidad_direcciones: { type: integer }
        cuenta_email: { type: string, description: Sólo cuando tiene cuenta de la tienda. }
        direcciones: { type: array, items: { $ref: '#/components/schemas/DireccionDeCliente' }, description: Sólo en la ficha. }
    ClienteEntrada:
      type: object
      required: [razon_social, condicion_iva]
      properties:
        razon_social: { type: string }
        condicion_iva: { type: string }
        tipo_doc: { type: [string, 'null'], enum: [dni, cuit, cuil, null] }
        nro_doc: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        telefono: { type: [string, 'null'] }
    DireccionEntrada:
      allOf:
        - $ref: '#/components/schemas/Direccion'
        - type: object
          required: [es_predeterminada]
          properties:
            es_predeterminada: { type: boolean, description: Viaja siempre (M-31). }
    DireccionDeCliente:
      allOf:
        - $ref: '#/components/schemas/Direccion'
        - type: object
          required: [id, es_predeterminada, resumen]
          properties:
            id: { type: integer }
            es_predeterminada: { type: boolean }
            resumen: { type: string }
    ProveedorFila:
      type: object
      required: [id, razon_social, activo]
      properties:
        id: { type: integer }
        razon_social: { type: string }
        activo: { type: boolean }
        cuit: { type: [string, 'null'] }
        cuit_formateado: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        telefono: { type: [string, 'null'] }
        contacto: { type: [string, 'null'] }
        canal_pedido: { type: string, enum: [email, portal_externo, manual] }
        canal_pedido_texto: { type: string }
        portal_url: { type: [string, 'null'], format: uri }
        plazo_entrega_dias: { type: [integer, 'null'] }
        productos: { type: integer }
        ordenes_compra: { type: integer }
        productos_activos: { type: integer, description: Sólo en la ficha. }
    ProveedorEntrada:
      type: object
      required: [razon_social, canal_pedido, activo]
      properties:
        razon_social: { type: string }
        cuit: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        telefono: { type: [string, 'null'] }
        contacto: { type: [string, 'null'] }
        canal_pedido: { type: string, enum: [email, portal_externo, manual] }
        portal_url: { type: [string, 'null'], format: uri, description: Obligatoria con `portal_externo`. }
        plazo_entrega_dias: { type: [integer, 'null'] }
        activo: { type: boolean }
    Impuesto:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        alicuota: { type: string }
        alcance: { type: string }
        alcance_texto: { type: string }
        comprobante: { type: string }
        comprobante_texto: { type: string }
        orden: { type: integer }
        activo: { type: boolean }
        productos: { type: integer, description: Sólo los de alcance `producto`. }
    ImpuestoEntrada:
      type: object
      required: [nombre, alicuota, alcance, comprobante, orden, activo]
      properties:
        nombre: { type: string }
        alicuota: { type: string }
        alcance: { type: string }
        comprobante: { type: string }
        orden: { type: integer }
        activo: { type: boolean }
    FactorCosto:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        modo: { type: string }
        modo_texto: { type: string }
        porcentaje: { type: string, description: Con tres decimales. }
        orden: { type: integer }
        activo: { type: boolean }
    FactorEntrada:
      type: object
      required: [nombre, modo, porcentaje, orden, activo]
      properties:
        nombre: { type: string }
        modo: { type: string }
        porcentaje: { type: string }
        orden: { type: integer }
        activo: { type: boolean }
    Lote:
      type: object
      description: El criterio queda **congelado como texto**.
      properties:
        id: { type: integer }
        operacion: { type: string }
        operacion_texto: { type: string }
        porcentaje: { type: [string, 'null'] }
        ganancia: { type: [string, 'null'] }
        redondeo_multiplo: { type: [string, 'null'] }
        parametro_texto: { type: [string, 'null'] }
        criterio_texto: { type: string }
        alcanzados: { type: integer }
        omitidos: { type: integer }
        usuario: { type: string }
        fecha: { $ref: '#/components/schemas/Fecha' }
        revierte_a:
          oneOf:
            - { type: object, properties: { id: { type: integer }, fecha: { $ref: '#/components/schemas/Fecha' } } }
            - type: 'null'
        deshecho_el:
          oneOf:
            - $ref: '#/components/schemas/Fecha'
            - type: 'null'
        reversible: { type: boolean, description: Sólo en el historial. }
    Movimiento:
      type: object
      properties:
        id: { type: integer }
        fecha: { $ref: '#/components/schemas/Fecha' }
        producto: { type: object, properties: { id: { type: integer }, codigo: { type: string }, nombre: { type: string } } }
        tipo: { type: string }
        tipo_texto: { type: string }
        cantidad: { type: integer }
        stock_anterior: { type: integer }
        stock_resultante: { type: integer }
        motivo: { type: [string, 'null'] }
        origen_texto: { type: [string, 'null'], description: 'En palabras del negocio, nunca una clase.' }
        remito_texto: { type: [string, 'null'] }
        registrado_por: { type: string }

    OrdenCompraFila:
      type: object
      required: [id, numero, fecha, proveedor, estado, estado_texto, total_estimado, editable]
      properties:
        id: { type: integer }
        numero: { type: string, examples: [OC-00007] }
        fecha: { $ref: '#/components/schemas/Fecha' }
        proveedor: { type: object, properties: { id: { type: integer }, razon_social: { type: string } } }
        estado: { type: string, enum: [borrador, aprobada, enviada, recibida_parcial, recibida, cancelada] }
        estado_texto: { type: string }
        generada_por_el_sistema: { type: boolean, description: 'La creó la reposición automática, sin una persona.' }
        total_estimado: { $ref: '#/components/schemas/Importe' }
        editable: { type: boolean, description: 'Lo decide el modelo: sólo un borrador se edita.' }
        productos: { type: integer }
    OrdenCompraFicha:
      description: |
        La fila más el proveedor completo, las líneas, las recepciones (asientos del kardex, con la forma
        de `Movimiento`) y `acciones`, que dice qué admite **el estado**, no el permiso (regla 9).
      allOf:
        - $ref: '#/components/schemas/OrdenCompraFila'
        - type: object
          properties:
            observaciones: { type: [string, 'null'] }
            creada_por: { type: [string, 'null'] }
            fecha_aprobacion: { oneOf: [{ $ref: '#/components/schemas/Fecha' }, { type: 'null' }] }
            aprobada_por: { type: [string, 'null'] }
            fecha_envio: { oneOf: [{ $ref: '#/components/schemas/Fecha' }, { type: 'null' }] }
            unidades_recibidas: { type: integer }
            unidades_pendientes: { type: integer }
            lineas:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  producto: { type: object, properties: { id: { type: integer }, codigo: { type: string }, nombre: { type: string }, activo: { type: boolean } } }
                  codigo_proveedor: { type: [string, 'null'] }
                  cantidad_pedida: { type: integer }
                  cantidad_recibida: { type: integer }
                  cantidad_pendiente: { type: integer }
                  costo_unitario: { $ref: '#/components/schemas/Importe' }
                  subtotal: { $ref: '#/components/schemas/Importe' }
            recepciones: { type: array, items: { $ref: '#/components/schemas/Movimiento' } }
            acciones:
              type: object
              properties:
                editar: { type: boolean }
                aprobar: { type: boolean }
                enviar: { type: boolean }
                recibir: { type: boolean }
                cerrar: { type: boolean, description: Sólo si entró algo y falta algo. }
                cancelar: { type: boolean }
                imprimir: { type: boolean }
    OrdenCompraEntrada:
      type: object
      required: [proveedor_id, lineas]
      description: '`estado` y `total_estimado` son 422 (`prohibited`): los decide el sistema.'
      properties:
        proveedor_id: { type: integer }
        observaciones: { type: [string, 'null'], maxLength: 255 }
        lineas:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [producto_id, cantidad_pedida, costo_unitario]
            properties:
              producto_id: { type: integer }
              cantidad_pedida: { type: integer, minimum: 1, maximum: 100000 }
              costo_unitario: { type: string, description: Número con punto decimal. }
    PedidoCompraEntrada:
      type: object
      required: [lineas]
      description: El pedido del armador. Un producto que ese proveedor no provee, o repetido, es 422 en su renglón.
      properties:
        lineas:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [producto_id, proveedor_id, cantidad_pedida, costo_unitario]
            properties:
              producto_id: { type: integer }
              proveedor_id: { type: integer }
              cantidad_pedida: { type: integer, minimum: 1, maximum: 100000 }
              costo_unitario: { type: string }
    RecepcionEntrada:
      type: object
      required: [cantidades]
      properties:
        cantidades:
          type: object
          description: 'Por id de línea, las unidades que llegaron: `{ "11": 4 }`.'
          additionalProperties: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
        remito_numero: { type: [string, 'null'], maxLength: 30, description: Va con la fecha o ninguno. }
        remito_fecha: { type: [string, 'null'], format: date, description: 'No posterior a hoy; va con el número o ninguno.' }
    Sugerido:
      type: object
      required: [id, codigo, nombre, disponible, stock_minimo, cantidad_reposicion, proveedor]
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        disponible: { type: integer }
        stock_minimo: { type: integer }
        cantidad_reposicion: { type: integer }
        proveedor: { type: [object, 'null'], properties: { id: { type: integer }, razon_social: { type: string } } }
        costo_ultimo: { $ref: '#/components/schemas/Importe', description: 'Sólo con `precio.ver_costo`: sin él, la clave no está.' }
    RenglonDelArmador:
      type: object
      properties:
        producto: { type: object, properties: { id: { type: integer }, codigo: { type: string }, nombre: { type: string } } }
        proveedor: { type: object, properties: { id: { type: integer }, razon_social: { type: string } } }
        cantidad_pedida: { type: integer }
        costo_unitario: { $ref: '#/components/schemas/Importe', description: 'El último costo del proveedor, aun sin `precio.ver_costo` (HL-127).' }
    VentaFila:
      type: object
      required: [id, numero, fecha, cliente, cliente_texto, canal, estado, estado_texto, total, editable]
      properties:
        id: { type: integer }
        numero: { type: string, examples: [V-10015] }
        fecha: { $ref: '#/components/schemas/Fecha' }
        cliente: { type: [object, 'null'], properties: { id: { type: integer }, razon_social: { type: string } }, description: '`null` sin cliente identificado.' }
        cliente_texto: { type: string, description: '«Sin identificar» si no hay cliente.' }
        vendedor: { type: [string, 'null'] }
        canal: { type: string, enum: [mostrador, online] }
        canal_texto: { type: string }
        estado: { type: string, enum: [presupuesto, pendiente_pago, pagada, en_preparacion, despachada, lista_retiro, entregada_parcial, entregada, cancelada, devuelta_parcial, devuelta] }
        estado_texto: { type: string }
        total: { $ref: '#/components/schemas/Importe' }
        editable: { type: boolean }
        productos: { type: integer }
        renglones_sin_stock: { type: integer }
        sin_stock: { type: boolean, description: 'La insignia: sólo un presupuesto con algún renglón que supera el disponible de hoy.' }
    VentaFicha:
      description: |
        La fila más el cliente, los renglones congelados (regla 3), las entregas, los comprobantes, los
        pagos (la devolución en negativo), `cobro`, `devolucion` y `acciones`. `acciones` dice qué admite
        **el estado**; el permiso lo decide la ruta en cada petición.
      allOf:
        - $ref: '#/components/schemas/VentaFila'
        - type: object
          properties:
            es_online: { type: boolean }
            medio_pago: { type: [string, 'null'] }
            modificada: { type: [string, 'null'] }
            observaciones: { type: [string, 'null'] }
            importes:
              type: object
              properties:
                subtotal: { $ref: '#/components/schemas/Importe' }
                descuento: { $ref: '#/components/schemas/Importe' }
                descuento_porcentaje: { type: string }
                total: { $ref: '#/components/schemas/Importe' }
                pagado: { $ref: '#/components/schemas/Importe' }
                saldo: { $ref: '#/components/schemas/Importe' }
            unidades_pendientes_de_entregar: { type: integer }
            lineas:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  producto: { type: object, properties: { id: { type: integer }, codigo: { type: string }, rotulo: { type: string }, activo: { type: boolean } } }
                  cotizacion_hoy: { type: [object, 'null'], description: 'Sólo en un presupuesto: precio de contado y disponible de hoy.' }
                  descripcion: { type: string }
                  alicuota_iva: { type: string }
                  cantidad: { type: integer }
                  cantidad_entregada: { type: integer }
                  cantidad_devuelta: { type: integer }
                  pendiente_de_entregar: { type: integer }
                  pendiente_de_devolver: { type: integer }
                  precio_unitario: { $ref: '#/components/schemas/Importe' }
                  neto: { $ref: '#/components/schemas/Importe' }
                  iva: { $ref: '#/components/schemas/Importe' }
                  impuestos: { type: array, items: { type: object } }
                  total: { $ref: '#/components/schemas/Importe' }
                  faltante: { type: [string, 'null'], description: Sólo en un presupuesto. }
            comprobantes_transferencia: { type: array, items: { type: object, properties: { id: { type: integer }, nombre_original: { type: string }, fecha: { $ref: '#/components/schemas/Fecha' } } } }
            entregas: { type: array, items: { type: object, properties: { id: { type: integer }, numero: { type: string }, fecha: { $ref: '#/components/schemas/Fecha' }, quien: { type: string }, unidades: { type: integer } } } }
            entregada_sin_comprobante: { type: boolean }
            pagos:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  fecha: { $ref: '#/components/schemas/Fecha' }
                  metodo: { type: string }
                  metodo_texto: { type: string }
                  monto: { $ref: '#/components/schemas/Importe' }
                  es_devolucion: { type: boolean }
                  registro: { type: [string, 'null'] }
            medios: { type: array, items: { type: object, properties: { metodo: { type: string }, texto: { type: string } } } }
            cobro:
              type: [object, 'null']
              description: 'Sólo si se puede cobrar. `principal` es el medio donde se propone el saldo (D-27).'
              properties:
                principal: { type: string }
                problemas: { type: array, items: { type: string } }
            devolucion:
              type: [object, 'null']
              description: 'Sólo si se puede devolver. `sugerido` es el medio del cobro más grande (HL-131).'
            acciones:
              type: object
              properties:
                editar: { type: boolean }
                recotizar: { type: boolean }
                cobrar: { type: boolean }
                entregar: { type: boolean }
                entregar_parte: { type: boolean, description: Falso con una sola unidad pendiente. }
                devolver: { type: boolean }
                cancelar: { type: boolean }
                imprimir: { type: boolean }
    VentaEntrada:
      type: object
      required: [lineas]
      description: |
        El precio lo pone el servidor: `estado`, `canal`, `total`, `lineas.*.precio_unitario` y los demás
        importes son 422 (`prohibited`). En la edición, los renglones que ya estaban conservan su precio.
      properties:
        cliente_id: { type: [integer, 'null'] }
        descuento_porcentaje: { type: [string, 'null'], description: Hasta el tope de la política. }
        observaciones: { type: [string, 'null'], maxLength: 255 }
        lineas:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [producto_id, cantidad]
            properties:
              producto_id: { type: integer }
              cantidad: { type: integer, minimum: 1, maximum: 100000 }
    CobroEntrada:
      type: object
      required: [pagos]
      description: 'Por el saldo exacto: otra suma es 409, sin errores por campo. Un medio repetido es 422.'
      properties:
        pagos:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            required: [metodo, monto]
            properties:
              metodo: { type: string, enum: [efectivo, transferencia, qr] }
              monto: { type: string, description: 'Mayor que cero, dos decimales como máximo.' }
    EntregaEntrada:
      type: object
      description: 'Sin cuerpo entrega todo lo pendiente. `usuario_id` y `estado` son 422: los decide el sistema.'
      properties:
        cantidades:
          type: object
          description: 'Por id de renglón, las unidades que salen.'
          additionalProperties: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
    DevolucionEntrada:
      type: object
      required: [cantidades, metodo]
      description: '`monto` y `estado` son 422: el monto lo calcula el servidor a partir de lo que vuelve.'
      properties:
        cantidades:
          type: object
          additionalProperties: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
        metodo: { type: string, enum: [efectivo, transferencia, qr] }
        motivo: { type: [string, 'null'], maxLength: 255 }
    Periodo:
      type: object
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        texto: { type: string, examples: [Del 01/11/2026 al 23/11/2026] }
    Comparacion:
      type: object
      description: 'La frase la arma el servidor: sin base no hay porcentaje (regla 16).'
      required: [sentido, porcentaje, texto]
      properties:
        sentido: { type: string, enum: [mas, menos, igual, sin_datos] }
        porcentaje: { type: [string, number, 'null'] }
        texto: { type: string }
    PanelPropio:
      type: object
      properties:
        periodo: { $ref: '#/components/schemas/Periodo' }
        vendi: { type: object, properties: { cantidad: { type: integer }, facturado: { $ref: '#/components/schemas/Importe' }, ticket: { $ref: '#/components/schemas/Importe' } } }
        cobre: { type: object, properties: { movimientos: { type: integer }, neto: { $ref: '#/components/schemas/Importe' } } }
        presupuestos_abiertos: { type: integer }
        anterior: { type: object, description: 'El período anterior, del mismo largo y pegado.' }
        comparaciones: { type: object, additionalProperties: { $ref: '#/components/schemas/Comparacion' } }
    PanelGeneral:
      type: object
      description: '`por_dia` y `por_metodo` los agrega la base (A-26). Lo que requiere atención es de hoy y no se compara.'
      properties:
        periodo: { $ref: '#/components/schemas/Periodo' }
        cobrado: { $ref: '#/components/schemas/Importe' }
        facturado: { $ref: '#/components/schemas/Importe' }
        cantidad: { type: integer }
        ticket: { $ref: '#/components/schemas/Importe' }
        descuentos: { $ref: '#/components/schemas/Importe' }
        margen_bruto: { $ref: '#/components/schemas/Importe', description: Antes del descuento de cabecera. }
        por_metodo: { type: array, items: { type: object, properties: { metodo: { type: string }, metodo_texto: { type: string }, movimientos: { type: integer }, neto: { $ref: '#/components/schemas/Importe' } } } }
        por_dia: { type: array, items: { type: object, properties: { dia: { type: string, format: date }, cantidad: { type: integer }, facturado: { $ref: '#/components/schemas/Importe' } } } }
        stock_critico: { type: integer }
        compras_abiertas: { type: integer }
        borradores_de_reposicion: { type: integer }
        anterior: { type: object }
        comparaciones: { type: object, additionalProperties: { $ref: '#/components/schemas/Comparacion' } }
    PersonaFila:
      type: object
      required: [id, nombre, apellido, nombre_completo, email, activo, rol]
      properties:
        id: { type: integer }
        nombre: { type: string }
        apellido: { type: string }
        nombre_completo: { type: string }
        email: { type: string, format: email }
        activo: { type: boolean }
        acceso_texto: { type: string }
        es_la_propia: { type: boolean, description: 'Ayuda de interfaz: el servidor da 409 igual.' }
        rol:
          type: object
          description: 'Con `usuario.cambiar_rol` suma `descripcion` y `permisos` (en la ficha).'
          properties:
            id: { type: integer }
            nombre: { type: string }
            descripcion: { type: [string, 'null'] }
            permisos: { type: array, items: { type: string } }
        empleado:
          type: [object, 'null']
          description: '`null` en una cuenta sin ficha.'
          properties:
            legajo: { type: string }
            dni: { type: string }
            telefono: { type: [string, 'null'] }
            fecha_ingreso: { type: string, format: date }
            fecha_baja: { type: [string, 'null'], format: date }
        situacion_texto: { type: string }
        roles_asignables:
          type: array
          description: 'Sólo en la ficha y con `usuario.cambiar_rol`: sin él, la clave no está (regla 36).'
          items: { type: object, properties: { id: { type: integer }, nombre: { type: string }, actual: { type: boolean } } }
    PersonaEntrada:
      type: object
      required: [nombre, apellido, email, activo, empleado]
      description: '`rol_id` y la contraseña sólo en el alta; `empleado.fecha_baja` sólo en la edición.'
      properties:
        nombre: { type: string, minLength: 2, maxLength: 100 }
        apellido: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        activo: { type: boolean, description: Obligatorio (M-31). }
        rol_id: { type: integer }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }
        empleado:
          type: object
          properties:
            legajo: { type: string }
            dni: { type: string }
            telefono: { type: [string, 'null'], maxLength: 30 }
            fecha_ingreso: { type: string, format: date }
            fecha_baja: { type: [string, 'null'], format: date }
    RolFila:
      type: object
      required: [id, nombre, ambito, es_sistema, se_puede_eliminar]
      properties:
        id: { type: integer }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        ambito: { $ref: '#/components/schemas/Ambito' }
        ambito_texto: { type: string }
        es_sistema: { type: boolean }
        cantidad_permisos: { type: integer }
        cantidad_usuarios: { type: integer }
        se_puede_eliminar: { type: boolean, description: 'Se deriva: no es de sistema y no tiene usuarios (regla 9).' }
        permisos: { type: array, items: { type: integer }, description: Los ids; sólo en la ficha. }
    RolEntrada:
      type: object
      description: |
        Un rol de sistema conserva nombre y ámbito. Uno de gestión sin permisos es 422. «Cualquier acción
        implica ver el módulo» la aplica el servicio.
      properties:
        nombre: { type: string }
        ambito: { $ref: '#/components/schemas/Ambito' }
        descripcion: { type: [string, 'null'], maxLength: 150 }
        permisos: { type: array, items: { type: integer } }
    Permiso:
      type: object
      properties:
        id: { type: integer }
        clave: { type: string, examples: [categoria.crear] }
        modulo: { type: string }
        descripcion: { type: string }

  responses:
    Credencial:
      description: La sesión abierta, con la forma propia de la credencial (api.md §4).
      content:
        application/json:
          schema:
            type: object
            required: [datos]
            properties:
              datos: { $ref: '#/components/schemas/Credencial' }
              mensaje: { type: string }
          example:
            datos:
              credencial: '…'
              tipo: Bearer
              vence: '2026-11-15T07:00:00Z'
              usuario: { nombre: Camila, apellido: Herrera, email: cliente@sistema.local }
    UrlFirmada:
      description: La URL firmada y temporal de la descarga (D-22). Vence a los cinco minutos.
      content:
        application/json:
          schema:
            type: object
            required: [datos]
            properties:
              datos: { $ref: '#/components/schemas/UrlFirmada' }
          example:
            datos:
              url: 'http://localhost:8000/api/v1/pedidos/42/comprobante.pdf?expires=1762874100&signature=3f9a…'
              vence: '2026-11-11T15:15:00Z'
    Pdf:
      description: El documento. Lo abre el navegador o el teléfono, sin credencial.
      content:
        application/pdf:
          schema: { type: string, format: binary }
    SinSesion:
      description: |
        `sin_sesion` (falta la credencial), `sesion_expirada` (venció) o `sesion_invalida` (revocada,
        desconocida, cuenta desactivada, o una cuenta de gestión en una ruta propia de la tienda). Trae
        `WWW-Authenticate: Bearer`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { mensaje: Necesitás iniciar sesión para continuar., codigo: sin_sesion, errores: {} }
    SinPermiso:
      description: Falta el permiso de la acción (`x-permiso`). El servidor lo decide en cada pedido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { mensaje: No tenés permiso para hacer esto., codigo: sin_permiso, errores: {} }
    FirmaInvalida:
      description: La URL firmada venció, fue tocada o no trae firma.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { mensaje: No tenés permiso para hacer esto., codigo: sin_permiso, errores: {} }
    NoEncontrado:
      description: Inexistente, inactivo **o ajeno**, sin distinguir.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { mensaje: No encontramos lo que buscás., codigo: no_encontrado, errores: {} }
    Conflicto:
      description: |
        Una regla del negocio lo impide: `regla_de_negocio`, `transicion_invalida`, `stock_insuficiente`,
        `carrito_cambio` (trae `cambios`) o `checkout_vencido`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { mensaje: 'No hay stock disponible de «Disco SSD WD Blue SN580 1TB»: hay 1 y se piden 2.', codigo: stock_insuficiente, errores: {} }
    Validacion:
      description: La validación rechaza, no corrige (M-31). Cada error, en su campo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            mensaje: El correo o la contraseña no son correctos.
            codigo: validacion
            errores: { email: [El correo o la contraseña no son correctos.] }
    DemasiadosIntentos:
      description: |
        El límite `tienda-acceso`: 5 por minuto por correo e IP, 30 por IP sola. Trae `reintentar_en`
        (segundos) y el encabezado `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Error' }
              - type: object
                required: [reintentar_en]
                properties:
                  reintentar_en: { type: integer, minimum: 1 }
          example: { mensaje: Demasiados intentos. Esperá 42 segundos y probá de nuevo., codigo: demasiados_intentos, errores: {}, reintentar_en: 42 }
    Perfil:
      description: La cuenta propia. Una escritura suma `mensaje`.
      content:
        application/json:
          schema:
            type: object
            required: [datos]
            properties:
              datos: { $ref: '#/components/schemas/Perfil' }
              mensaje: { type: string }
          example:
            datos:
              nombre: Lucía
              apellido: Paredes
              email: lucia@correo.local
              telefono: 297-4001122
              razon_social: Lucía Paredes
              tipo_doc: dni
              tipo_doc_texto: DNI
              nro_doc: '38123456'
              condicion_iva: consumidor_final
              condicion_iva_texto: Consumidor final
              direccion: { calle: San Martín, numero: '1234', piso_depto: 2 B, codigo_postal: '9000', localidad: Comodoro Rivadavia, provincia: Chubut }
    Carrito:
      description: El carrito entero. Cada escritura lo devuelve, con su `mensaje`, para no pedirlo de nuevo.
      content:
        application/json:
          schema:
            type: object
            required: [datos]
            properties:
              datos: { $ref: '#/components/schemas/Carrito' }
              mensaje: { type: string }
          example:
            datos:
              id: 12
              estado: activo
              estado_texto: En armado
              reservado_hasta: null
              unidades: 2
              renglones:
                - id: 41
                  cantidad: 2
                  producto: { id: 7, codigo: MOU-0007, nombre: Mouse Logitech G505, imagen: 'http://10.0.2.2:8000/storage/productos/demo-mouse-g505-1.webp', en_tienda: true, disponibilidad: disponible, disponibilidad_texto: Disponible }
                  precios:
                    contado: { unitario: '42000.00', subtotal: '84000.00', texto: Efectivo o transferencia }
                    lista: { unitario: '46200.00', subtotal: '92400.00', texto: Mercado Pago }
              totales:
                contado: { importe: '84000.00', texto: Efectivo o transferencia }
                lista: { importe: '92400.00', texto: Mercado Pago }
              avisos:
                - { producto_id: 7, descripcion: Mouse Logitech G505, tipo: precio, lista: contado, anterior: '40000.00', actual: '42000.00' }
            mensaje: Agregaste el producto al carrito.
    Pedido:
      description: El pedido; 201 si nació, 200 si ya existía (el reintento recibe el mismo número).
      content:
        application/json:
          schema:
            type: object
            required: [datos]
            properties:
              datos: { $ref: '#/components/schemas/Pedido' }
          example:
            datos:
              id: 42
              numero: V-00042
              estado: pendiente_pago
              estado_texto: Esperando el pago
              medio_pago: contado
              medio_pago_texto: Efectivo en el local
              modo_entrega: retiro
              modo_entrega_texto: Retiro en el local
              direccion: null
              reserva_vence: '2026-11-13T15:00:00Z'
              creado: '2026-11-11T15:00:00Z'
              lineas:
                - { producto_id: 7, descripcion: Mouse Logitech G505, cantidad: 2, precio_unitario: '54450.00', total: '108900.00' }
              importes: { subtotal: '108900.00', costo_envio: '0.00', total: '108900.00' }
    PedidoDetalle:
      description: El detalle del pedido, con el estado del pago derivado.
      content:
        application/json:
          schema:
            type: object
            required: [datos]
            properties:
              datos: { $ref: '#/components/schemas/PedidoDetalle' }
              mensaje: { type: string }
          example:
            datos:
              id: 42
              numero: V-00042
              estado: pendiente_pago
              estado_texto: Esperando el pago
              medio_pago: transferencia
              medio_pago_texto: Transferencia bancaria
              modo_entrega: retiro
              modo_entrega_texto: Retiro en el local
              direccion: null
              reserva_vence: '2026-11-18T13:00:00Z'
              creado: '2026-11-13T13:00:00Z'
              lineas:
                - { producto_id: 7, descripcion: Mouse Logitech G505, cantidad: 2, precio_unitario: '54450.00', total: '108900.00' }
              importes: { subtotal: '108900.00', costo_envio: '0.00', total: '108900.00' }
              estado_pago: en_revision
              estado_pago_texto: Pago recibido, en revisión
              ultimo_pago: null
              comprobante_disponible: false
              transferencia:
                alias: COMPUSTACK.TIENDA
                titular: CompuStack S.R.L.
                comprobante_cargado: true
                aviso: Recibimos tu comprobante. Dentro de las 72 horas hábiles confirmamos el pago y seguimos con tu pedido.
    Intento:
      description: El intento de pago, con el estado del pedido y del pago ya derivados.
      content:
        application/json:
          schema:
            type: object
            required: [datos]
            properties:
              datos: { $ref: '#/components/schemas/Intento' }
              mensaje: { type: string }
          example:
            datos:
              id: 17
              pasarela: mercadopago
              pasarela_texto: Mercado Pago
              estado: pendiente
              estado_texto: Esperando la confirmación
              importe: '121000.00'
              url_pago: 'https://www.mercadopago.com.ar/checkout/v1/redirect?pref_id=1234-abcd'
              vence: '2026-11-13T15:20:00Z'
              resuelto: null
              creado: '2026-11-13T15:00:00Z'
              pedido: { id: 42, numero: V-00042, estado: pendiente_pago, estado_texto: Esperando el pago, estado_pago: pendiente, estado_pago_texto: Esperando la confirmación del pago }
            mensaje: Iniciaste el pago.
    Marca:
      description: La marca. El alta suma «Marca «X» creada.».
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/Marca' }
              mensaje: { type: string }
    Categoria:
      description: La categoría; la ficha suma `ancestros` y `contenido_activo`.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/CategoriaFila' }
              mensaje: { type: string }
          example:
            datos:
              id: 2
              nombre: Teclados
              slug: teclados
              parent_id: 1
              ruta: Periféricos › Teclados
              dentro_de: Periféricos
              nivel: 2
              orden: 14
              activo: true
              subcategorias: 0
              productos: 1
              ancestros: [{ id: 1, nombre: Periféricos }]
              contenido_activo: { subcategorias: 0, productos: 1 }
    ListadoDeCategorias:
      description: Una página de categorías, planas.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Paginado'
              - { type: object, properties: { datos: { type: array, items: { $ref: '#/components/schemas/CategoriaFila' } } } }
    ProductoGestion:
      description: La ficha de gestión, con «Producto «X» creado.» o «… actualizado.».
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/ProductoGestionFicha' }
              mensaje: { type: string }
    Vinculo:
      description: El vínculo con su producto. En el vínculo suelto, `mas_barato` y `diferencia` no se calculan.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/Vinculo' }
              mensaje: { type: string }
          example:
            datos:
              proveedor: { id: 3, razon_social: Insumos del Valle S.A., activo: true, plazo_entrega_dias: 14 }
              costo_ultimo: '54900.00'
              codigo_proveedor: IV-505
              es_preferido: false
              mas_barato: false
              diferencia: null
              pedido_en_curso: null
              producto: { id: 1, nombre: Teclado mecánico G505, codigo: TEC-G505 }
            mensaje: Se agregó Insumos del Valle S.A..
    Cliente:
      description: El cliente; la ficha suma sus direcciones.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/Cliente' }
              mensaje: { type: string }
    DireccionDeCliente:
      description: La dirección, con un mensaje que dice si quedó predeterminada.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/DireccionDeCliente' }
              mensaje: { type: string }
          example:
            datos: { id: 7, calle: Av. Eva Perón, numero: '1450', piso_depto: null, codigo_postal: '9011', localidad: Caleta Olivia, provincia: Santa Cruz, es_predeterminada: true, resumen: 'Av. Eva Perón 1450 — Caleta Olivia, Santa Cruz (9011)' }
            mensaje: Se agregó la dirección y quedó como predeterminada.
    Proveedor:
      description: El proveedor; la ficha suma `productos_activos`.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/ProveedorFila' }
              mensaje: { type: string }
    Impuesto:
      description: El impuesto, con su conteo de productos.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/Impuesto' }
              mensaje: { type: string }
    FactorCosto:
      description: El factor de costo.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/FactorCosto' }
              mensaje: { type: string }
    Politica:
      description: La política vigente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Hecho' }
          example:
            datos: { ganancia_global: '2.500', margen_global: '60.00', recargo_lista: '0.000', redondeo_multiplo: '0.01', redondeo_modo: cercano, redondeo_modo_texto: Al múltiplo más cercano }
    Lote:
      description: El lote del ajuste.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/Lote' }
              mensaje: { type: string }
          example:
            datos:
              id: 2
              operacion: deshacer
              operacion_texto: Deshacer un ajuste anterior
              porcentaje: null
              ganancia: null
              redondeo_multiplo: null
              parametro_texto: null
              criterio_texto: 'Deshace el ajuste del 21/11/2026 10:30: Categoría Memorias y sus subcategorías'
              alcanzados: 1
              omitidos: 0
              usuario: Vallejo, Ximena
              fecha: '2026-11-21T13:30:00Z'
              revierte_a: { id: 1, fecha: '2026-11-21T13:30:00Z' }
              deshecho_el: null
            mensaje: Se devolvieron los precios de 1 producto(s).
    OrdenCompra:
      description: La ficha de la orden; las operaciones suman el `mensaje` que daba la web.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/OrdenCompraFicha' }
              mensaje: { type: string }
    Venta:
      description: La ficha de la venta; las operaciones suman el `mensaje` que daba la web.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/VentaFicha' }
              mensaje: { type: string }
    Persona:
      description: La ficha de la cuenta; las operaciones suman su `mensaje`.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/PersonaFila' }
              mensaje: { type: string }
    Rol:
      description: El rol con los ids de sus permisos; el alta y la edición suman su `mensaje`.
      content:
        application/json:
          schema:
            type: object
            properties:
              datos: { $ref: '#/components/schemas/RolFila' }
              mensaje: { type: string }
          example:
            datos:
              id: 3
              nombre: Vendedor
              descripcion: Emite presupuestos y ventas. No cobra ni anula.
              ambito: gestion
              ambito_texto: Gestión
              es_sistema: true
              cantidad_permisos: 9
              cantidad_usuarios: 8
              se_puede_eliminar: false
              permisos: [1, 9, 19, 20, 33, 34, 35, 37, 51]
