openapi: 3.1.0

info:
  title: CompuStack — API v1
  version: r20
  summary: Un solo contrato para la app de la tienda y la administración web.
  description: |
    Una operación de negocio tiene **un solo camino**: el servicio, detrás de un endpoint. La app y la
    administración son dos clientes del mismo endpoint, con la misma credencial y los mismos permisos.

    - **Siempre JSON**, también los errores y una ruta inexistente. Nunca HTML ni redirección.
    - Claves en español y `snake_case`. **Dinero como cadena** con dos decimales (`"60500.00"`).
      Cantidades enteras. Fechas ISO 8601 UTC con `Z`.
    - Un recurso: `{ "datos": {…} }`, más `mensaje` en una operación. Un listado pagina siempre
      (`Paginado`). Un error: `{ "mensaje", "codigo", "errores" }` (`Error`).
    - **Representación por permiso** (regla 36): el mismo recurso trae más o menos claves según los
      permisos de quien pregunta. Lo que no se puede ver **no viaja**, ni siquiera en `null`.
    - Cada operación protegida declara su permiso en `x-permiso`. Los permisos de `GET /yo` son ayuda
      de interfaz: el servidor vuelve a decidir en cada pedido, así que un cambio de permisos vale en
      el pedido siguiente aunque la credencial siga siendo la misma.
    - `x-api-md` remite a la sección de `docs/api.md` que documenta la operación con todo detalle.
  contact:
    name: CompuStack

servers:
  - url: http://localhost:8000/api/v1
    description: Desarrollo (php artisan serve)
  - url: http://10.0.2.2:8000/api/v1
    description: La misma API vista desde el emulador de Android

tags:
  - name: Sesión
    description: Común a los dos clientes (r14). La vigencia la decide el ámbito de la cuenta.
  - name: Tienda
    description: Catálogo público, cuenta, carrito, pedidos y pagos de la app (Etapa 2, api.md §7.1 a 7.7).
  - name: Catálogo
    description: Gestión de marcas, categorías, productos y sus proveedores (api.md §7.8).
  - name: Terceros
    description: Clientes, direcciones y proveedores (api.md §7.9).
  - name: Precios y stock
    description: Parametrización, ajuste masivo, kardex y ajuste por conteo (api.md §7.10).
  - name: Compras
    description: Órdenes de compra, armador, transiciones y recepción (api.md §7.11).
  - name: Ventas
    description: Ventas del mostrador, cobros, entregas, devoluciones, panel e informes (api.md §7.12).
  - name: Usuarios y accesos
    description: Personal, roles, permisos y contraseñas (api.md §7.13).
  - name: Descargas
    description: |
      Las URL firmadas que devuelven otros endpoints (D-22). Se abren **sin credencial**: la firma es
      la autorización. Vencen a los cinco minutos; vencida, tocada o sin firma, 403 `sin_permiso`.

paths:

  # ── Sesión (api.md §4, §7.2 y §7.13) ─────────────────────────────────────────────────────────

  /sesion:
    post:
      tags: [Sesión]
      summary: Iniciar sesión
      description: |
        La usan los dos clientes. Una cuenta de gestión recibe la misma forma, con vigencia de 8 horas;
        una de la tienda, de 7 días (D-31). Contraseña incorrecta, correo inexistente y cuenta inactiva
        dan **el mismo 422**, con el error en `email`: decir cuál falló permitiría enumerar cuentas.
        No abre una sesión de navegador.
      operationId: iniciarSesion
      x-api-md: '§7.2 POST /api/v1/sesion'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, description: Se compara sin mayúsculas ni espacios. }
                password: { type: string }
            example: { email: vendedor@sistema.local, password: demo1234 }
      responses:
        '200': { $ref: '#/components/responses/Credencial' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/DemasiadosIntentos' }
    delete:
      tags: [Sesión]
      summary: Cerrar la sesión de este dispositivo
      description: |
        La credencial con que llegó el pedido deja de servir (después, 401 `sesion_invalida`); las de
        otros dispositivos siguen. Sin permiso propio.
      operationId: cerrarSesion
      x-api-md: '§7.2 DELETE /api/v1/sesion'
      security: [{ credencial: [] }]
      responses:
        '204': { description: Sesión cerrada. Sin cuerpo. }
        '401': { $ref: '#/components/responses/SinSesion' }

  /registro:
    post:
      tags: [Sesión]
      summary: Crear una cuenta de la tienda
      description: |
        Crea la cuenta con el rol Cliente y su ficha (DNI sin número, consumidor final) y deja la sesión
        abierta. El rol y el estado no se eligen: `rol_id` o `activo` en el cuerpo se ignoran.
      operationId: registrar
      x-api-md: '§7.2 POST /api/v1/registro'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, apellido, email, password, password_confirmation]
              properties:
                nombre: { type: string, maxLength: 100 }
                apellido: { type: string, maxLength: 100, description: 'Con el nombre, hasta 150: es la razón social.' }
                email: { type: string, format: email, maxLength: 150, description: Único; se guarda en minúsculas y sin espacios. }
                password: { type: string, minLength: 8, description: Con letras y números. }
                password_confirmation: { type: string }
                telefono: { type: string, maxLength: 30 }
            example:
              nombre: Lucía
              apellido: Paredes
              email: lucia@correo.local
              password: clave1234
              password_confirmation: clave1234
      responses:
        '201': { $ref: '#/components/responses/Credencial' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/DemasiadosIntentos' }

  /yo:
    get:
      tags: [Sesión]
      summary: Quién tiene la sesión
      description: |
        La cuenta, su rol con el ámbito y la lista completa y ordenada de sus permisos (no se pagina).
        Los dos clientes pintan la interfaz con esto. **Pintar no es autorizar**: cada endpoint vuelve a
        pedir su permiso.
      operationId: yo
      x-api-md: '§7.2 GET /api/v1/yo'
      security: [{ credencial: [] }]
      responses:
        '200':
          description: La cuenta de la sesión.
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { $ref: '#/components/schemas/Yo' }
              example:
                datos:
                  nombre: Sofía
                  apellido: Gutiérrez
                  email: vendedor@sistema.local
                  rol: { nombre: Vendedor, ambito: gestion }
                  permisos: [categoria.ver, cliente.crear, cliente.ver, panel.ver_propio, producto.ver, venta.crear, venta.editar, venta.entregar, venta.ver]
        '401': { $ref: '#/components/responses/SinSesion' }

  /yo/contrasena:
    put:
      tags: [Sesión]
      summary: Cambiar la contraseña propia
      description: |
        De toda cuenta, también de la tienda: sin permiso a propósito (M-21). **Rota la credencial**
        (HL-132): revoca todas las de la cuenta, también la del pedido, y devuelve una nueva con la forma
        de `POST /sesion`. Desde la respuesta, la credencial con que se pidió es 401. Sin caché.
      operationId: cambiarContrasenaPropia
      x-api-md: '§7.13 PUT /yo/contrasena'
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_actual, password, password_confirmation]
              properties:
                password_actual: { type: string }
                password: { type: string, minLength: 8, description: Distinta de la actual. }
                password_confirmation: { type: string }
            example: { password_actual: demo1234, password: demo12345, password_confirmation: demo12345 }
      responses:
        '200': { $ref: '#/components/responses/Credencial' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '422': { $ref: '#/components/responses/Validacion' }

  /contrasena/restablecer:
    post:
      tags: [Sesión]
      summary: Fijar la contraseña con el enlace de un solo uso
      description: |
        Pública, con el límite del ingreso. **No emite credencial**: la persona entra después con la
        contraseña nueva. `ambito` le dice a la pantalla adónde mandarla (D-26). El token lo verifica el
        broker de Laravel (60 minutos); inventado, usado, vencido o de otra cuenta, 422 en `email`. Un
        error en `password` no lo gasta. Revoca todas las credenciales de la cuenta.
      operationId: restablecerContrasena
      x-api-md: '§7.13 POST /contrasena/restablecer'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200':
          description: La contraseña quedó fijada.
          content:
            application/json:
              schema:
                type: object
                required: [datos, mensaje]
                properties:
                  datos:
                    type: object
                    required: [ambito]
                    properties:
                      ambito: { $ref: '#/components/schemas/Ambito' }
                  mensaje: { type: string }
              example:
                datos: { ambito: tienda }
                mensaje: Tu contraseña quedó configurada. Ya podés entrar desde la app de la tienda con tu correo y la contraseña que elegiste.
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/DemasiadosIntentos' }


  # ── Tienda: catálogo (api.md §7.1) ───────────────────────────────────────────────────────────

  /categorias:
    get:
      tags: [Tienda]
      summary: El árbol de categorías visibles
      description: |
        Se pagina **por raíz** y cada raíz trae su rama entera (hasta tres niveles): `total` cuenta
        raíces. Una hoja trae `hijas: []`. Orden: `orden`, `nombre`, `id`. La ruta no exige credencial
        y una que no sirve **no es error**: el árbol no depende de quién mira.

        **La gestión** pide otra representación del mismo recurso (regla 36) con `forma=lista`: el listado
        plano, 15 por página, con `categoria.ver`. Sin el permiso, o sin credencial, 403 (§7.8).
      operationId: arbolDeCategorias
      x-api-md: '§7.1 GET /api/v1/categorias y §7.8 Categorías'
      x-permiso-por-forma: { sin forma: ninguno, lista: categoria.ver }
      security: [{}, { credencial: [] }]
      parameters:
        - { name: forma, in: query, schema: { type: string, enum: [lista] } }
        - { name: q, in: query, description: Sólo con `forma=lista`., schema: { type: string, maxLength: 100 } }
        - { name: parent_id, in: query, description: '`raiz` o un id. Sólo con `forma=lista`.', schema: { type: string } }
        - { name: estado, in: query, description: Sólo con `forma=lista`., schema: { type: string, enum: [activas, inactivas] } }
        - { name: con_hijas, in: query, description: Sólo con `forma=lista`., schema: { type: boolean } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Sin `forma`, las raíces de la página con sus ramas; con `forma=lista`, filas de `CategoriaFila`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    properties:
                      datos:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/CategoriaArbol'
                            - $ref: '#/components/schemas/CategoriaFila'
              example:
                datos:
                  - id: 1
                    nombre: Componentes
                    hijas:
                      - { id: 2, nombre: Placas de video, hijas: [] }
                      - { id: 4, nombre: Memorias RAM, hijas: [] }
                pagina: 1
                por_pagina: 20
                ultima_pagina: 1
                total: 1
                criterios: {}
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }
    post:
      tags: [Catálogo]
      summary: Dar de alta una categoría
      operationId: altaDeCategoria
      x-api-md: '§7.8 Categorías'
      x-permiso: categoria.crear
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaEntrada' }
            example: { nombre: Teclados, parent_id: 1, orden: 14, activo: true }
      responses:
        '201': { $ref: '#/components/responses/Categoria' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /productos:
    get:
      tags: [Tienda]
      summary: El catálogo, filtrado, ordenado y paginado
      description: |
        **Sesión opcional.** Con `tienda.ver_precios`, cada fila suma la clave `precios`; sin el permiso
        la clave **no está**. Nunca viajan el costo, la ganancia, el precio manual, el stock ni los
        proveedores. La validación rechaza y no corrige: un `orden` o una `seccion` desconocidos son 422.
        Los órdenes por precio sin sesión son 401 y sin el permiso 403, **antes de consultar**: ordenar
        dejaría deducir los precios que no viajan.

        **La gestión** pide otra representación del mismo recurso (regla 36) con `forma=gestion`
        (`ProductoGestion`), con `producto.ver`: también los inactivos, y los filtros `marca_id`,
        `proveedor_id`, `estado`, `stock`, `con_proveedor` y `excluir[]`. Sin sesión, 401; con una cuenta
        sin el permiso, 403. Sin `forma`, la respuesta es la de la tienda, byte a byte (§7.8).
      operationId: catalogo
      x-api-md: '§7.1 GET /api/v1/productos y §7.8 Productos'
      x-permiso-por-forma: { sin forma: ninguno, gestion: producto.ver }
      security: [{}, { credencial: [] }]
      parameters:
        - { name: forma, in: query, schema: { type: string, enum: [gestion] } }
        - { name: marca_id, in: query, description: Sólo con `forma=gestion`., schema: { type: integer } }
        - { name: proveedor_id, in: query, description: Sólo con `forma=gestion`; uno que no existe es 422., schema: { type: integer } }
        - { name: estado, in: query, description: Sólo con `forma=gestion`., schema: { type: string, enum: [activos, inactivos] } }
        - { name: stock, in: query, description: Sólo con `forma=gestion`., schema: { type: string, enum: [disponible, agotado, critico, sin_proveedor] } }
        - { name: con_proveedor, in: query, description: Sólo con `forma=gestion`., schema: { type: boolean } }
        - { name: 'excluir[]', in: query, description: 'Sólo con `forma=gestion`, hasta 50 ids.', schema: { type: array, maxItems: 50, items: { type: integer } } }
        - { name: q, in: query, description: Nombre o código contiene., schema: { type: string, maxLength: 100 } }
        - { name: categoria_id, in: query, description: La categoría y sus hijas y nietas., schema: { type: integer, minimum: 1 } }
        - name: orden
          in: query
          description: '`nombre` por omisión (`recientes` en novedades). Los de precio piden `tienda.ver_precios`.'
          schema: { type: string, enum: [nombre, recientes, precio_asc, precio_desc] }
        - { name: seccion, in: query, schema: { type: string, enum: [novedades, destacados] } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página del catálogo. `criterios` trae siempre las cuatro claves que el servidor aplicó.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/ProductoTienda' } }
                      criterios:
                        type: object
                        required: [categoria_id, q, orden, seccion]
              example:
                datos:
                  - id: 4
                    codigo: SSD-WD1TB
                    nombre: Disco SSD WD Blue SN580 1TB
                    descripcion_breve: Unidad de estado sólido NVMe de 1 TB en formato M.2. Arranca el sistema y abre los programas en segundos…
                    imagen: http://10.0.2.2:8000/storage/productos/demo-ssd-wd1tb-1.webp
                    categoria: { id: 9, nombre: Discos SSD }
                    es_novedad: true
                    es_destacado: true
                    disponibilidad: disponible
                    disponibilidad_texto: Disponible
                    precios:
                      contado: { importe: '54450.00', texto: Efectivo o transferencia }
                      lista: { importe: '60500.00', texto: Mercado Pago }
                pagina: 1
                por_pagina: 20
                ultima_pagina: 981
                total: 19610
                criterios: { categoria_id: null, q: null, orden: nombre, seccion: null }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }
    post:
      tags: [Catálogo]
      summary: Dar de alta un producto
      description: '`multipart/form-data` si lleva `imagenes[]` (jpg, png o webp, hasta 1 MB cada una; 5 en total).'
      operationId: altaDeProducto
      x-api-md: '§7.8 Productos'
      x-permiso: producto.crear
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
      responses:
        '201': { $ref: '#/components/responses/ProductoGestion' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /productos/{producto}:
    parameters:
      - $ref: '#/components/parameters/Producto'
    get:
      tags: [Tienda]
      summary: La ficha de un producto
      description: |
        **Sesión opcional.** Todo lo del listado (también `precios`, con el permiso) más la descripción
        completa, la galería (nunca vacía) y la marca (`null` si no tiene). Inexistente, inactivo o con
        una categoría oculta: el mismo 404, **byte a byte**.

        Con `forma=gestion` y `producto.ver`, la ficha de gestión de cualquier producto
        (`ProductoGestionFicha`), con sus claves por permiso (§7.8).
      operationId: fichaDeProducto
      x-api-md: '§7.1 GET /api/v1/productos/{id} y §7.8 Productos'
      x-permiso-por-forma: { sin forma: ninguno, gestion: producto.ver }
      security: [{}, { credencial: [] }]
      parameters:
        - { name: forma, in: query, schema: { type: string, enum: [gestion] } }
      responses:
        '200':
          description: La ficha.
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { $ref: '#/components/schemas/ProductoFicha' }
              example:
                datos:
                  id: 4
                  codigo: SSD-WD1TB
                  nombre: Disco SSD WD Blue SN580 1TB
                  descripcion_breve: Unidad de estado sólido NVMe de 1 TB en formato M.2…
                  imagen: http://10.0.2.2:8000/storage/productos/demo-ssd-wd1tb-1.webp
                  categoria: { id: 9, nombre: Discos SSD }
                  es_novedad: true
                  es_destacado: true
                  disponibilidad: ultimas_unidades
                  disponibilidad_texto: Últimas unidades
                  descripcion: Unidad de estado sólido NVMe de 1 TB en formato M.2.
                  galeria: [http://10.0.2.2:8000/storage/productos/demo-ssd-wd1tb-1.webp]
                  marca: { id: 9, nombre: Western Digital }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Catálogo]
      summary: Editar un producto
      description: |
        Con imágenes, `POST` con `_method=PATCH` (HL-110). `activo` y `precio_manual` viajan siempre (M-31):
        sin ellos, 422. Sin `imagenes_orden`, las guardadas no se tocan.
      operationId: editarProducto
      x-api-md: '§7.8 Productos'
      x-permiso: producto.editar
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
      responses:
        '200': { $ref: '#/components/responses/ProductoGestion' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Catálogo]
      summary: Eliminar un producto
      description: Con stock o movimientos **lo desactiva** (regla 2) y lo dice.
      operationId: bajaDeProducto
      x-api-md: '§7.8 Productos'
      x-permiso: producto.eliminar
      security: [{ credencial: [] }]
      responses:
        '200':
          description: '`eliminado` dice si se eliminó o se desactivó.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hecho' }
              example: { datos: { id: 1, eliminado: false }, mensaje: '«Teclado mecánico G505» tiene stock o historial de movimientos: se desactivó en lugar de eliminarse.' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /tienda:
    get:
      tags: [Tienda]
      summary: Lo que la tienda ofrece hoy
      description: |
        Los modos de entrega, con los mismos textos que el checkout. El costo del envío **no viaja**
        (el visitante no ve precios). La ruta no lee la credencial. Es un recurso: no pagina.
      operationId: tienda
      x-api-md: '§7.1 GET /api/v1/tienda'
      security: []
      responses:
        '200':
          description: Los modos de entrega vigentes.
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos:
                    type: object
                    required: [entrega]
                    properties:
                      entrega:
                        type: array
                        items:
                          type: object
                          required: [modo, texto]
                          properties:
                            modo: { $ref: '#/components/schemas/ModoEntrega' }
                            texto: { type: string }
              example:
                datos:
                  entrega:
                    - { modo: retiro, texto: Retiro en el local }
                    - { modo: envio, texto: Envío a domicilio }

  # ── Tienda: cuenta (api.md §7.2) ─────────────────────────────────────────────────────────────

  /perfil:
    get:
      tags: [Tienda]
      summary: La cuenta propia
      description: |
        Sólo de la tienda: una cuenta de gestión no tiene ficha de cliente y recibe 401
        `sesion_invalida`. `condicion_iva` es sólo para verse: la carga el local.
      operationId: perfil
      x-api-md: '§7.2 GET /api/v1/perfil'
      security: [{ credencial: [] }]
      responses:
        '200': { $ref: '#/components/responses/Perfil' }
        '401': { $ref: '#/components/responses/SinSesion' }
    patch:
      tags: [Tienda]
      summary: Editar la cuenta propia
      description: |
        **Parcial**: una clave que no viene no se toca. `tipo_doc` y `nro_doc` van juntos o ninguno.
        `direccion` edita la predeterminada (o la crea); `null` la quita. `email`, `condicion_iva`,
        `razon_social` y cualquier importe se rechazan con 422 en su campo.
      operationId: editarPerfil
      x-api-md: '§7.2 PATCH /api/v1/perfil'
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, maxLength: 100 }
                apellido: { type: string, maxLength: 100 }
                telefono: { type: [string, 'null'], maxLength: 30 }
                tipo_doc: { type: [string, 'null'], enum: [dni, cuit, cuil, null] }
                nro_doc: { type: [string, 'null'], description: 'DNI de 7 u 8 dígitos; CUIT o CUIL de 11, con su dígito verificador.' }
                direccion:
                  oneOf:
                    - $ref: '#/components/schemas/Direccion'
                    - type: 'null'
            example:
              apellido: Paredes Ruiz
              tipo_doc: cuit
              nro_doc: 20-12345678-6
      responses:
        '200': { $ref: '#/components/responses/Perfil' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '422': { $ref: '#/components/responses/Validacion' }

  # ── Tienda: carrito y checkout (api.md §7.3) ─────────────────────────────────────────────────

  /carrito:
    get:
      tags: [Tienda]
      summary: El carrito vigente
      description: |
        Vive en el servidor, uno por cuenta: ninguna ruta lleva su id. Sin uno, devuelve uno vacío
        **sin crearlo** (`id: null`): un `GET` no escribe. No pagina: partiría los totales. Sin
        `tienda.ver_precios` no viajan `precios`, `totales` ni los avisos de precio.
      operationId: carrito
      x-api-md: '§7.3 GET /api/v1/carrito'
      x-permiso: tienda.comprar
      security: [{ credencial: [] }]
      responses:
        '200': { $ref: '#/components/responses/Carrito' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    delete:
      tags: [Tienda]
      summary: Vaciar el carrito
      description: Quita todos los renglones; el carrito queda. Vaciar uno vacío también es 200.
      operationId: vaciarCarrito
      x-api-md: '§7.3 DELETE /api/v1/carrito'
      x-permiso: tienda.comprar
      security: [{ credencial: [] }]
      responses:
        '200': { $ref: '#/components/responses/Carrito' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /carrito/lineas:
    post:
      tags: [Tienda]
      summary: Agregar un producto al carrito
      description: |
        Si ya está, **suma** en el mismo renglón: 201 si el renglón es nuevo, 200 si sumó. Sólo
        verifica que haya disponible: la reserva ocurre en el checkout (D-16). Cualquier importe en el
        cuerpo (`precio`, `total`…) es 422: el precio lo pone el servidor.
      operationId: agregarAlCarrito
      x-api-md: '§7.3 POST /api/v1/carrito/lineas'
      x-permiso: tienda.comprar
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [producto_id, cantidad]
              properties:
                producto_id: { type: integer }
                cantidad: { type: integer, minimum: 1, maximum: 10 }
            example: { producto_id: 7, cantidad: 2 }
      responses:
        '200': { $ref: '#/components/responses/Carrito' }
        '201': { $ref: '#/components/responses/Carrito' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /carrito/lineas/{linea}:
    parameters:
      - $ref: '#/components/parameters/Linea'
    patch:
      tags: [Tienda]
      summary: Fijar la cantidad de un renglón
      description: Un renglón de otra cuenta es 404, igual que uno que no existe.
      operationId: cambiarCantidad
      x-api-md: '§7.3 PATCH /api/v1/carrito/lineas/{linea}'
      x-permiso: tienda.comprar
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cantidad]
              properties:
                cantidad: { type: integer, minimum: 1, maximum: 10 }
            example: { cantidad: 3 }
      responses:
        '200': { $ref: '#/components/responses/Carrito' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Tienda]
      summary: Quitar un renglón
      operationId: quitarDelCarrito
      x-api-md: '§7.3 DELETE /api/v1/carrito/lineas/{linea}'
      x-permiso: tienda.comprar
      security: [{ credencial: [] }]
      responses:
        '200': { $ref: '#/components/responses/Carrito' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /carrito/checkout:
    post:
      tags: [Tienda]
      summary: Revalidar y reservar el carrito
      description: |
        Sin cuerpo. Si algo cambió respecto de lo que la persona vio, 409 `carrito_cambio` con `cambios`
        (las referencias quedan al día y el segundo intento pasa). Si no, reserva cada renglón **todo o
        nada** por 20 minutos. Idempotente: con la reserva en plazo devuelve el mismo resumen. Suma
        `medios` (cuánto sale por cada uno y con qué entregas vale, D-28) y `entrega`, con su costo.
      operationId: checkout
      x-api-md: '§7.3 POST /api/v1/carrito/checkout'
      x-permiso: tienda.comprar
      security: [{ credencial: [] }]
      responses:
        '200':
          description: El carrito reservado, con los medios y las entregas.
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { $ref: '#/components/schemas/Checkout' }
              example:
                datos:
                  id: 12
                  estado: en_checkout
                  estado_texto: Reservado mientras confirmás
                  reservado_hasta: '2026-11-11T15:20:00Z'
                  unidades: 2
                  renglones: []
                  totales:
                    contado: { importe: '84000.00', texto: Efectivo o transferencia }
                    lista: { importe: '92400.00', texto: Mercado Pago }
                  avisos: []
                  medios:
                    - { medio: contado, texto: Efectivo en el local, modos_entrega: [retiro], total: '84000.00' }
                    - { medio: transferencia, texto: Transferencia bancaria, modos_entrega: [retiro, envio], total: '84000.00' }
                    - { medio: pasarela, texto: Mercado Pago, modos_entrega: [retiro, envio], total: '92400.00' }
                  entrega:
                    - { modo: retiro, texto: Retiro en el local, costo: '0.00' }
                    - { modo: envio, texto: Envío a domicilio, costo: '8000.00' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  # ── Tienda: pedidos y su consulta (api.md §7.4 y §7.6) ───────────────────────────────────────

  /pedidos:
    post:
      tags: [Tienda]
      summary: Confirmar el pedido
      description: |
        Convierte el carrito reservado en una venta online, en una transacción. **Idempotente por
        `carrito_id`** (D-8): si ya es un pedido, 200 con **ese** pedido. Los renglones se congelan con
        la lista del medio. Que el pedido esté registrado **no dice que se pagó**: nace en
        `pendiente_pago`. De contado con envío es 422 en `medio_pago` (D-28). Los importes, prohibidos.
      operationId: confirmarPedido
      x-api-md: '§7.4 POST /api/v1/pedidos'
      x-permiso: tienda.comprar
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrito_id, medio_pago, modo_entrega]
              properties:
                carrito_id: { type: integer, description: El del checkout. Es la clave de la idempotencia. }
                medio_pago: { $ref: '#/components/schemas/MedioPago' }
                modo_entrega: { $ref: '#/components/schemas/ModoEntrega' }
                direccion:
                  allOf: [{ $ref: '#/components/schemas/Direccion' }]
                  description: Obligatoria con `envio`; con `retiro`, mandarla es 422.
            example: { carrito_id: 12, medio_pago: contado, modo_entrega: retiro }
      responses:
        '200': { $ref: '#/components/responses/Pedido' }
        '201': { $ref: '#/components/responses/Pedido' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }
    get:
      tags: [Tienda]
      summary: Mis pedidos
      description: |
        Sólo los de la cuenta y sólo los de la tienda, del más nuevo al más viejo. `estado` del pedido y
        `estado_pago` del pago van por separado. Sin `tienda.ver_precios`, `importes` no viaja.
      operationId: misPedidos
      x-api-md: '§7.6 GET /api/v1/pedidos'
      x-permiso: tienda.ver_pedidos
      security: [{ credencial: [] }]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página de pedidos. `criterios` vacío.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/PedidoResumen' } }
              example:
                datos:
                  - id: 42
                    numero: V-00042
                    creado: '2026-11-11T15:00:00Z'
                    estado: pendiente_pago
                    estado_texto: Esperando el pago
                    estado_pago: rechazado
                    estado_pago_texto: 'Pago rechazado: podés reintentar'
                    unidades: 2
                    importes: { total: '129000.00' }
                pagina: 1
                por_pagina: 20
                ultima_pagina: 1
                total: 1
                criterios: {}
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /pedidos/{pedido}:
    parameters:
      - $ref: '#/components/parameters/Pedido'
    get:
      tags: [Tienda]
      summary: El detalle de un pedido
      description: |
        La forma de `POST /pedidos` más `estado_pago`, `ultimo_pago`, `comprobante_disponible` y
        `transferencia`. Los precios son los del pedido. Ajeno o inexistente: el mismo 404.
      operationId: detalleDePedido
      x-api-md: '§7.6 GET /api/v1/pedidos/{id}'
      x-permiso: tienda.ver_pedidos
      security: [{ credencial: [] }]
      responses:
        '200': { $ref: '#/components/responses/PedidoDetalle' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /pedidos/{pedido}/comprobante:
    parameters:
      - $ref: '#/components/parameters/Pedido'
    get:
      tags: [Tienda]
      summary: El enlace del comprobante
      description: |
        Una URL firmada de cinco minutos (D-22) que la app abre en el navegador: la credencial no
        viaja en la URL. Sin pagar o cancelado, 409 `regla_de_negocio`.
      operationId: enlaceDelComprobante
      x-api-md: '§7.6 GET /api/v1/pedidos/{id}/comprobante'
      x-permiso: tienda.ver_pedidos
      security: [{ credencial: [] }]
      responses:
        '200': { $ref: '#/components/responses/UrlFirmada' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /pedidos/{pedido}/comprobante.pdf:
    parameters:
      - $ref: '#/components/parameters/Pedido'
      - $ref: '#/components/parameters/Expires'
      - $ref: '#/components/parameters/Signature'
    get:
      tags: [Descargas]
      summary: El comprobante en PDF
      description: El mismo PDF que la web, sin costo ni vendedor. La URL la da `GET /pedidos/{pedido}/comprobante`.
      operationId: comprobantePdf
      x-api-md: '§7.6 GET /api/v1/pedidos/{id}/comprobante'
      security: []
      responses:
        '200': { $ref: '#/components/responses/Pdf' }
        '403': { $ref: '#/components/responses/FirmaInvalida' }

  # ── Tienda: pagos (api.md §7.5) ──────────────────────────────────────────────────────────────

  /pedidos/{pedido}/pagos:
    parameters:
      - $ref: '#/components/parameters/Pedido'
    post:
      tags: [Tienda]
      summary: Iniciar un intento de pago
      description: |
        Sobre un pedido propio por pasarela, pendiente y con la reserva vigente. **Como mucho un intento
        pendiente por pedido**: si ya hay uno, 200 con **ese** intento. Un intento no es un pago: el
        pago lo escribe el servidor cuando el proveedor confirma. El rechazo conserva la reserva (D-9).
      operationId: iniciarPago
      x-api-md: '§7.5 POST /api/v1/pedidos/{id}/pagos'
      x-permiso: tienda.comprar
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pasarela]
              properties:
                pasarela: { type: string, enum: [mercadopago, simulador] }
            example: { pasarela: mercadopago }
      responses:
        '200': { $ref: '#/components/responses/Intento' }
        '201': { $ref: '#/components/responses/Intento' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }
    get:
      tags: [Tienda]
      summary: Los intentos de pago de un pedido
      description: El último primero. `criterios` vacío.
      operationId: intentosDePago
      x-api-md: '§7.5 GET /api/v1/pedidos/{id}/pagos'
      x-permiso: tienda.ver_pedidos
      security: [{ credencial: [] }]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página de intentos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/Intento' } }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /pedidos/{pedido}/pagos/{intento}:
    parameters:
      - $ref: '#/components/parameters/Pedido'
      - $ref: '#/components/parameters/Intento'
    get:
      tags: [Tienda]
      summary: El resultado de un intento
      description: |
        Si está pendiente, **antes de responder el servidor consulta al proveedor** y aplica lo que dice.
        Sólo la consulta al proveedor confirma: que el cliente haya vuelto no cambia nada. Si el
        proveedor no contesta, sigue pendiente (regla 16). Un intento de otro pedido es 404.
      operationId: resultadoDelPago
      x-api-md: '§7.5 GET /api/v1/pedidos/{id}/pagos/{intento}'
      x-permiso: tienda.ver_pedidos
      security: [{ credencial: [] }]
      responses:
        '200': { $ref: '#/components/responses/Intento' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /simulador/intentos/{intento}/aprobar:
    parameters:
      - $ref: '#/components/parameters/Intento'
    post:
      tags: [Tienda]
      summary: 'Simulador: aprobar un intento (no es un cobro real)'
      description: |
        **Existe sólo con `TIENDA_SIMULADOR` encendido**; en producción no hay ruta (D-13). Resuelve el
        intento por el mismo camino que Mercado Pago: deja el pedido pagado con un pago de método
        «Simulador — no es cobro real».
      operationId: simuladorAprobar
      x-api-md: '§7.5 POST /api/v1/simulador/intentos/{intento}/aprobar y …/rechazar'
      x-condicional: TIENDA_SIMULADOR
      x-permiso: tienda.comprar
      security: [{ credencial: [] }]
      responses:
        '200': { $ref: '#/components/responses/Intento' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /simulador/intentos/{intento}/rechazar:
    parameters:
      - $ref: '#/components/parameters/Intento'
    post:
      tags: [Tienda]
      summary: 'Simulador: rechazar un intento (no es un cobro real)'
      description: Sólo con `TIENDA_SIMULADOR` encendido. No escribe ningún pago y conserva la reserva.
      operationId: simuladorRechazar
      x-api-md: '§7.5 POST /api/v1/simulador/intentos/{intento}/aprobar y …/rechazar'
      x-condicional: TIENDA_SIMULADOR
      x-permiso: tienda.comprar
      security: [{ credencial: [] }]
      responses:
        '200': { $ref: '#/components/responses/Intento' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ── Tienda: transferencia (api.md §7.7) ──────────────────────────────────────────────────────

  /pedidos/{pedido}/comprobante-transferencia:
    parameters:
      - $ref: '#/components/parameters/Pedido'
    post:
      tags: [Tienda]
      summary: Cargar el comprobante de una transferencia
      description: |
        `multipart/form-data`. Un segundo comprobante se suma al primero. La tienda confirma el pago en
        la administración, y recién ahí sale el stock. Al cargarlo, la reserva se estira a tres días
        hábiles. No es idempotente: el cliente no lo reintenta solo.
      operationId: cargarComprobanteTransferencia
      x-api-md: '§7.7 POST /api/v1/pedidos/{id}/comprobante-transferencia'
      x-permiso: tienda.cargar_comprobante
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary, description: 'JPG, PNG o PDF, hasta 5 MB.' }
      responses:
        '201': { $ref: '#/components/responses/PedidoDetalle' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }


  # ── Gestión del catálogo: marcas (api.md §7.8) ───────────────────────────────────────────────

  /marcas:
    get:
      tags: [Catálogo]
      summary: Las marcas
      operationId: marcas
      x-api-md: '§7.8 Marcas'
      x-permiso: marca.ver
      security: [{ credencial: [] }]
      parameters:
        - $ref: '#/components/parameters/Q'
        - { name: estado, in: query, schema: { type: string, enum: [activas, inactivas] } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página de marcas (15 por omisión), con cuántos productos usa cada una.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - { type: object, properties: { datos: { type: array, items: { $ref: '#/components/schemas/Marca' } } } }
              example:
                datos: [{ id: 1, nombre: Logitech, slug: logitech, logo: null, activo: true, productos: 1 }]
                pagina: 1
                por_pagina: 15
                ultima_pagina: 1
                total: 1
                criterios: { q: null, estado: activas }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }
    post:
      tags: [Catálogo]
      summary: Dar de alta una marca
      description: '`multipart/form-data` si lleva logo. `activo` viaja siempre (M-31).'
      operationId: altaDeMarca
      x-api-md: '§7.8 Marcas'
      x-permiso: marca.crear
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MarcaEntrada' }
      responses:
        '201': { $ref: '#/components/responses/Marca' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
