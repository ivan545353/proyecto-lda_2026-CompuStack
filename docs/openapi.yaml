  # ── Gestión del catálogo: proveedores de un producto (api.md §7.8) ───────────────────────────

  /productos/{producto}/proveedores:
    parameters:
      - $ref: '#/components/parameters/Producto'
    get:
      tags: [Catálogo]
      summary: Los proveedores de un producto, en tres formas
      description: |
        Sin `forma`: a quién se le puede pedir (sólo activos; el elegido primero, después por costo).
        `forma=comparador`: los vínculos por costo, con el más barato y cuánto más caro es cada uno.
        `forma=disponibles`: los activos que todavía no lo proveen. **El permiso depende de la forma**,
        así que lo decide el Form Request y no la ruta (`x-permiso-por-forma`). `costo_ultimo` viaja
        sólo con `precio.ver_costo`.
      operationId: proveedoresDelProducto
      x-api-md: '§7.8 Proveedores de un producto'
      x-permiso-por-forma: { sin forma: proveedor.ver, comparador: producto.editar, disponibles: producto.editar }
      security: [{ credencial: [] }]
      parameters:
        - { name: forma, in: query, schema: { type: string, enum: [comparador, disponibles] } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página de proveedores, con la forma pedida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paginado' }
              example:
                datos:
                  - { id: 1, razon_social: Distribuidora Austral S.A., es_preferido: true, costo_ultimo: '52000.00' }
                  - { id: 2, razon_social: Mayorista Sur S.R.L., es_preferido: false, costo_ultimo: '57200.00' }
                pagina: 1
                por_pagina: 20
                ultima_pagina: 1
                total: 2
                criterios: { forma: null }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
    post:
      tags: [Catálogo]
      summary: Agregar un proveedor al producto
      description: |
        El producto lo da la URL (`producto_id` en el cuerpo es 422). El primer proveedor queda elegido
        aunque no se marque, y el mensaje lo dice.
      operationId: agregarProveedorAlProducto
      x-api-md: '§7.8 Proveedores de un producto'
      x-permiso: producto.editar
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { type: object, required: [proveedor_id], properties: { proveedor_id: { type: integer } } }
                - $ref: '#/components/schemas/VinculoEntrada'
            example: { proveedor_id: 3, costo_ultimo: '54900.00', codigo_proveedor: IV-505, es_preferido: false }
      responses:
        '201': { $ref: '#/components/responses/Vinculo' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

