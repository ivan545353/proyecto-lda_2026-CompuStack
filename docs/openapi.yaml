                      calculo: { $ref: '#/components/schemas/Calculo' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /precios/ajustes/vista-previa:
    get:
      tags: [Precios y stock]
      summary: Mirar un ajuste masivo antes de aplicarlo
      description: |
        **No escribe.** Los conteos del conjunto entero y una página de «precio actual → nuevo». `costo` y
        `costo_nuevo` son de `precio.ver_costo`: sin el permiso las claves no están. Un recorte vacío,
        «todos» con un recorte puesto, un rango al revés o un porcentaje de 0 son 422.
      operationId: vistaPreviaDelAjuste
      x-api-md: '§7.10 Ajuste masivo y su historial'
      x-permiso: precio.ajustar_masivo
      security: [{ credencial: [] }]
      parameters:
        - $ref: '#/components/parameters/AjusteOperacion'
        - { name: porcentaje, in: query, schema: { type: string } }
        - { name: ganancia, in: query, schema: { type: string } }
        - { name: redondeo_multiplo, in: query, schema: { type: string } }
        - { name: alcance, in: query, required: true, schema: { type: string, enum: [todos, recorte] } }
        - { name: categoria_id, in: query, schema: { type: integer } }
        - { name: marca_id, in: query, schema: { type: integer } }
        - { name: proveedor_id, in: query, schema: { type: integer } }
        - { name: incluir_manuales, in: query, required: true, description: Viaja siempre (M-31)., schema: { type: boolean } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: La proyección, con `conteos` y `criterio_texto` en el sobre.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    required: [conteos, criterio_texto]
                    properties:
                      conteos: { type: object, additionalProperties: { type: integer } }
                      criterio_texto: { type: string }
              example:
                datos:
                  - { id: 1, codigo: MEM-DDR4-16, nombre: Memoria DDR4 16 GB, precio_contado: '60500.00', precio_lista: '60500.00', nuevo_contado: '69575.00', nuevo_lista: '69575.00', variacion: '15.00', resultado: aplicado, resultado_texto: Cambia precio, bajo_costo: false, costo: '20000.00', costo_nuevo: null }
                pagina: 1
                por_pagina: 20
                ultima_pagina: 1
                total: 1
                criterios: {}
                conteos: { total: 1, alcanzados: 1, sin_cambio: 0, sin_costo: 0, manuales_afuera: 0, bajo_costo: 0 }
                criterio_texto: Categoría Memorias y sus subcategorías
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /precios/ajustes:
    post:
      tags: [Precios y stock]
      summary: Aplicar un ajuste masivo
      description: |
        Recibe lo mismo que la vista previa, en el cuerpo. Devuelve el lote con su criterio **congelado
        como texto**. Si no alcanza a ningún producto, 409 `regla_de_negocio`: no se escribió nada (HL-122).
      operationId: aplicarAjuste
      x-api-md: '§7.10 Ajuste masivo y su historial'
      x-permiso: precio.ajustar_masivo
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operacion, alcance, incluir_manuales]
              properties:
                operacion: { type: string, enum: [precio, costo, ganancia, redondeo, recalculo] }
                porcentaje: { type: string }
                ganancia: { type: string }
                redondeo_multiplo: { type: string }
                alcance: { type: string, enum: [todos, recorte] }
                categoria_id: { type: integer }
                marca_id: { type: integer }
                proveedor_id: { type: integer }
                ids: { type: array, items: { type: integer } }
                incluir_manuales: { type: boolean }
            example: { operacion: precio, porcentaje: '15', alcance: recorte, categoria_id: 4, incluir_manuales: false }
      responses:
        '201': { $ref: '#/components/responses/Lote' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /precios/lotes:
    get:
      tags: [Precios y stock]
      summary: El historial de ajustes masivos
      description: |
        Del más nuevo al más viejo, sin filtros. Cada lote suma `reversible`, y el sobre suma `reversible`
        (el lote entero, o `null`): el único que se puede deshacer, esté en la página que esté.
      operationId: lotes
      x-api-md: '§7.10 Ajuste masivo y su historial'
      x-permiso: precio.ver
      security: [{ credencial: [] }]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página de lotes. `criterios` vacío.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    required: [reversible]
                    properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/Lote' } }
                      reversible:
                        oneOf:
                          - $ref: '#/components/schemas/Lote'
                          - type: 'null'
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /precios/lotes/{lote}/deshacer:
    parameters:
      - { name: lote, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Precios y stock]
      summary: Deshacer el último ajuste
      description: |
        Escribe el lote que devuelve los precios (regla 1: nada se borra). Sólo el último que se puede
        deshacer; otro es 409. Si los productos cambiaron todos de precio después, 409 también.
      operationId: deshacerAjuste
      x-api-md: '§7.10 Ajuste masivo y su historial'
      x-permiso: precio.deshacer_ajuste
      security: [{ credencial: [] }]
      responses:
        '201': { $ref: '#/components/responses/Lote' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ── Stock: kardex y ajuste por conteo (api.md §7.10) ─────────────────────────────────────────

  /stock/movimientos:
    get:
      tags: [Precios y stock]
      summary: El kardex
      description: |
        Del más nuevo al más viejo, de a 20. `origen_texto` dice de dónde salió en palabras del negocio.
        Un rango al revés es 422 en `hasta`.
      operationId: kardex
      x-api-md: '§7.10 Kardex y ajuste de inventario'
      x-permiso: stock.ver
      security: [{ credencial: [] }]
      parameters:
        - $ref: '#/components/parameters/FiltroProducto'
        - { name: tipo, in: query, schema: { type: string } }
        - { name: usuario_id, in: query, schema: { type: integer } }
        - { name: canal, in: query, schema: { type: string, enum: [mostrador, online] } }
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página de movimientos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - { type: object, properties: { datos: { type: array, items: { $ref: '#/components/schemas/Movimiento' } } } }
              example:
                datos:
                  - id: 1
                    fecha: '2026-11-21T13:30:00Z'
                    producto: { id: 1, codigo: MEM-DDR4-16, nombre: Memoria DDR4 16 GB }
                    tipo: ajuste
                    tipo_texto: Ajuste de inventario
                    cantidad: -2
                    stock_anterior: 10
                    stock_resultante: 8
                    motivo: Dos unidades con la caja rota
                    origen_texto: null
                    remito_texto: null
                    registrado_por: Ximena Vallejo
                pagina: 1
                por_pagina: 20
                ultima_pagina: 1
                total: 1
                criterios: { producto_id: null, tipo: null, usuario_id: null, canal: null, desde: null, hasta: null }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /stock/movimientos/impresion:
    get:
      tags: [Precios y stock]
      summary: El enlace del kardex impreso
      operationId: imprimirKardex
      x-api-md: '§7.10 Kardex y ajuste de inventario'
      x-permiso: stock.ver
      security: [{ credencial: [] }]
      parameters:
        - $ref: '#/components/parameters/FiltroProducto'
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/ImpresionFormato'
        - $ref: '#/components/parameters/ImpresionColumnas'
        - $ref: '#/components/parameters/ImpresionOrientacion'
        - $ref: '#/components/parameters/ImpresionHoja'
        - $ref: '#/components/parameters/ImpresionDensidad'
      responses:
        '200': { $ref: '#/components/responses/UrlFirmada' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /stock/usuarios:
    get:
      tags: [Precios y stock]
      summary: Quiénes registraron algún movimiento
      description: Las opciones del filtro `usuario_id` del kardex. `criterios` vacío.
      operationId: usuariosDelKardex
      x-api-md: '§7.10 Kardex y ajuste de inventario'
      x-permiso: stock.ver
      security: [{ credencial: [] }]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página de personas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paginado' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /productos/{producto}/stock:
    parameters:
      - $ref: '#/components/parameters/Producto'
    get:
      tags: [Precios y stock]
      summary: El stock de un producto y dónde está lo reservado
      description: 'Lo reservado no tiene asiento en el kardex: sale del depósito al cobrar (regla 5).'
      operationId: stockDeProducto
      x-api-md: '§7.10 Kardex y ajuste de inventario'
      x-permiso: stock.ver
      security: [{ credencial: [] }]
      responses:
        '200':
          description: El stock.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hecho' }
              example:
                datos:
                  id: 1
                  codigo: MEM-DDR4-16
                  nombre: Memoria DDR4 16 GB
                  texto: MEM-DDR4-16 — Memoria DDR4 16 GB
                  activo: true
                  stock: 10
                  stock_reservado: 0
                  disponible: 10
                  stock_minimo: 2
                  reservas: { pedidos: 0, carritos: 0 }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /productos/{producto}/ajustes-stock:
    parameters:
      - $ref: '#/components/parameters/Producto'
    post:
      tags: [Precios y stock]
      summary: Ajustar el stock por conteo físico
      description: |
        Pide el **conteo**, no la diferencia. `stock_esperado` es el que la pantalla mostraba: si al guardar
        es otro, alguien movió el stock mientras se contaba y es 409, sin pisar ese movimiento. Un conteo
        igual al registrado también es 409. `producto_id` o `tipo` en el cuerpo son 422.
      operationId: ajustarStock
      x-api-md: '§7.10 Kardex y ajuste de inventario'
      x-permiso: stock.ajustar
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_contado, stock_esperado, motivo]
              properties:
                stock_contado: { type: integer, minimum: 0 }
                stock_esperado: { type: integer }
                motivo: { type: string }
            example: { stock_contado: 8, stock_esperado: 10, motivo: Dos unidades con la caja rota }
      responses:
        '201':
          description: El movimiento escrito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos: { $ref: '#/components/schemas/Movimiento' }
                  mensaje: { type: string }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }


  # ── Compras (api.md §7.11) ───────────────────────────────────────────────────────────────────

  /compras:
    get:
      tags: [Compras]
      summary: Las órdenes de compra
      description: Del más nuevo al más viejo, de a 20. Un rango al revés es 422 en `hasta`.
      operationId: ordenesDeCompra
      x-api-md: '§7.11 Compras'
      x-permiso: compra.ver
      security: [{ credencial: [] }]
      parameters:
        - { name: q, in: query, description: El número de la orden., schema: { type: string, maxLength: 100 } }
        - { name: estado, in: query, schema: { type: string, enum: [abiertas, borrador, aprobada, enviada, recibida_parcial, recibida, cancelada] } }
        - { name: origen, in: query, schema: { type: string, enum: [reposicion, manual] } }
        - { name: proveedor_id, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página de órdenes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - { type: object, properties: { datos: { type: array, items: { $ref: '#/components/schemas/OrdenCompraFila' } } } }
              example:
                datos:
                  - id: 7
                    numero: OC-00007
                    fecha: '2026-11-21T13:30:00Z'
                    proveedor: { id: 2, razon_social: Distribuidora Austral }
                    estado: borrador
                    estado_texto: Borrador
                    generada_por_el_sistema: false
                    total_estimado: '25000.00'
                    editable: true
                    productos: 1
                pagina: 1
                por_pagina: 20
                ultima_pagina: 1
                total: 1
                criterios: { q: null, estado: null, origen: null, proveedor_id: null, desde: null, hasta: null }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }
    post:
      tags: [Compras]
      summary: El pedido del armador
      description: |
        Crea **un borrador por proveedor** y devuelve las órdenes creadas con la forma del listado, con un
        mensaje que las nombra y recuerda que hay que aprobar cada una para poder enviarla.
      operationId: pedidoDelArmador
      x-api-md: '§7.11 Compras'
      x-permiso: compra.crear
      security: [{ credencial: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoCompraEntrada' }
      responses:
        '201':
          description: Las órdenes creadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/OrdenCompraFila' } }
                  mensaje: { type: string }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /compras/impresion:
    get:
      tags: [Compras]
      summary: El enlace del listado impreso de órdenes
      description: Con los mismos filtros del listado (D-22).
      operationId: imprimirOrdenesDeCompra
      x-api-md: '§7.11 Compras'
      x-permiso: compra.ver
      security: [{ credencial: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: estado, in: query, schema: { type: string } }
        - { name: origen, in: query, schema: { type: string, enum: [reposicion, manual] } }
        - { name: proveedor_id, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/ImpresionFormato'
        - $ref: '#/components/parameters/ImpresionColumnas'
        - $ref: '#/components/parameters/ImpresionOrientacion'
        - $ref: '#/components/parameters/ImpresionHoja'
        - $ref: '#/components/parameters/ImpresionDensidad'
      responses:
        '200': { $ref: '#/components/responses/UrlFirmada' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /compras/proveedores:
    get:
      tags: [Compras]
      summary: Los proveedores para elegir
      description: Todos, o con `activos=1` sólo los activos (HL-125).
      operationId: proveedoresDeCompras
      x-api-md: '§7.11 Compras'
      x-permiso: compra.ver
      security: [{ credencial: [] }]
      parameters:
        - { name: activos, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página de proveedores `{ id, razon_social }`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paginado' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /compras/sugeridos:
    get:
      tags: [Compras]
      summary: Qué hay que reponer
      description: |
        Con su proveedor. El sobre suma `grupos` (de la página, en orden alfabético), `sin_proveedor` (los
        que hacen falta y nadie provee) y `estimado_pagina`. `costo_ultimo`, `grupos[].estimado` y
        `estimado_pagina` son de `precio.ver_costo`: sin él, **las claves no están** (reglas 21 y 36).
      operationId: sugeridosDeCompra
      x-api-md: '§7.11 Compras'
      x-permiso: compra.crear
      security: [{ credencial: [] }]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página de sugeridos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/Sugerido' } }
                      grupos: { type: array, items: { type: object } }
                      sin_proveedor: { type: integer }
                      estimado_pagina: { $ref: '#/components/schemas/Importe' }
              example:
                datos:
                  - id: 1
                    codigo: TEC-00123
                    nombre: Teclado mecánico
                    disponible: 1
                    stock_minimo: 5
                    cantidad_reposicion: 10
                    proveedor: { id: 2, razon_social: Distribuidora Austral }
                    costo_ultimo: '2500.00'
                pagina: 1
                por_pagina: 20
                ultima_pagina: 1
                total: 1
                criterios: {}
                grupos:
                  - { proveedor: { id: 2, razon_social: Distribuidora Austral }, productos: [1], estimado: '25000.00' }
                sin_proveedor: 0
                estimado_pagina: '25000.00'
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /compras/armador:
    get:
      tags: [Compras]
      summary: Los sugeridos elegidos, como renglones del armador
      description: |
        Rechaza, no corrige (M-31): lo que dejó de hacer falta no entra, y `descartados` lo cuenta.
        `hay_pedibles` es false si ningún producto activo tiene un proveedor activo (HL-124).
      operationId: armadorDeCompra
      x-api-md: '§7.11 Compras'
      x-permiso: compra.crear
      security: [{ credencial: [] }]
      parameters:
        - { name: 'productos[]', in: query, required: true, schema: { type: array, items: { type: integer } } }
      responses:
        '200':
          description: Los renglones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/RenglonDelArmador' } }
                  descartados: { type: integer }
                  aviso: { type: [string, 'null'] }
                  hay_pedibles: { type: boolean }
              example:
                datos:
                  - producto: { id: 1, codigo: TEC-00123, nombre: Teclado mecánico }
                    proveedor: { id: 2, razon_social: Distribuidora Austral }
                    cantidad_pedida: 10
                    costo_unitario: '2500.00'
                descartados: 1
                aviso: 'Uno de los productos que elegiste ya no hace falta pedirlo: le cargaron stock o ya tiene un pedido en curso. No se agregó.'
                hay_pedibles: true
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /compras/{orden}:
    parameters:
      - $ref: '#/components/parameters/Orden'
    get:
      tags: [Compras]
      summary: La ficha de una orden
      operationId: ordenDeCompra
      x-api-md: '§7.11 Compras'
      x-permiso: compra.ver
      security: [{ credencial: [] }]
      responses:
        '200': { $ref: '#/components/responses/OrdenCompra' }
