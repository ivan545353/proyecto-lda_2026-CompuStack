  /ventas:
    get:
      tags: [Ventas]
      summary: Las ventas de la administración
      description: |
        Del más nuevo al más viejo, de a 20. `cliente` y `vendedor` de `criterios` son los nombres del
        filtrado por id, para el chip de la pantalla.
      operationId: ventas
      x-api-md: '§7.12 Ventas, panel e informes'
      x-permiso: venta.ver
      security: [{ credencial: [] }]
      parameters:
        - { name: q, in: query, description: Número o cliente., schema: { type: string, maxLength: 100 } }
        - { name: estado, in: query, schema: { type: string, enum: [presupuesto, pendiente_pago, pagada, en_preparacion, despachada, lista_retiro, entregada_parcial, entregada, cancelada, devuelta_parcial, devuelta] } }
        - { name: cliente_id, in: query, schema: { type: integer } }
        - { name: vendedor_id, in: query, schema: { type: integer } }
        - { name: canal, in: query, schema: { type: string, enum: [mostrador, online] } }
        - { name: pago, in: query, schema: { type: string, enum: [transferencia_en_revision] } }
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Una página de ventas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - { type: object, properties: { datos: { type: array, items: { $ref: '#/components/schemas/VentaFila' } } } }
              example:
                datos:
                  - id: 10015
                    numero: V-10015
                    fecha: '2026-11-22T23:39:00Z'
                    cliente: { id: 5005, razon_social: 'Herrera, Rodrigo' }
                    cliente_texto: 'Herrera, Rodrigo'
                    vendedor: 'Aguirre, Micaela'
                    canal: mostrador
                    canal_texto: Mostrador
                    estado: presupuesto
                    estado_texto: Presupuesto
                    total: '1871500.00'
                    editable: true
                    productos: 4
                    renglones_sin_stock: 0
                    sin_stock: false
                pagina: 1
                por_pagina: 20
                ultima_pagina: 501
                total: 10016
                criterios: { q: null, estado: null, cliente_id: null, cliente: null, vendedor_id: null, vendedor: null, canal: null, pago: null, desde: null, hasta: null }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }
    post:
      tags: [Ventas]
      summary: Emitir un presupuesto
